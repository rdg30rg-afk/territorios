function enfocar (idTerr) {
  const propias = [...manzanas.values()].filter(m => m.territorio === idTerr)
  if (!propias.length) return
  const pts = propias.flatMap(m => m.geom.coordinates[0].map(([x, y]) => [y, x]))
  mapa.fitBounds(L.latLngBounds(pts).pad(0.35))
}

function avisar (html) { document.getElementById('aviso').innerHTML = html }

// El navegador integrado del editor devuelve siempre false en confirm() y
// rompe en prompt(). Estos dos los reemplazan con un dialogo de la propia pagina.
function dialogo ({ titulo, cuerpo, campo, aceptar = 'Aceptar', peligro = false }) {
  return new Promise((resolver) => {
    const velo = document.createElement('div')
    velo.className = 'velo'
    velo.innerHTML = `<div class="dlg">
      <h4>${titulo}</h4>
      <p>${cuerpo}</p>
      ${campo !== undefined ? `<input id="dlgCampo" value="${String(campo).replace(/"/g, '&quot;')}">` : ''}
      <div class="acc" style="margin-top:14px">
        <button class="b sec" data-r="0">${icono('cerrar')} Cancelar</button>
        <button class="b ${peligro ? 'dan' : 'pri'}" data-r="1">${icono(peligro ? 'eliminar' : 'completo')} ${aceptar}</button>
      </div></div>`
    document.body.appendChild(velo)
    const entrada = velo.querySelector('#dlgCampo')
    if (entrada) { entrada.focus(); entrada.select() }

    const cerrar = (ok) => {
      velo.remove()
      removeEventListener('keydown', teclas, true)
      resolver(ok ? (entrada ? entrada.value.trim() : true) : null)
    }
    const teclas = (e) => {
      if (e.key === 'Escape') { e.stopPropagation(); cerrar(false) }
      if (e.key === 'Enter' && entrada) { e.stopPropagation(); cerrar(true) }
    }
    addEventListener('keydown', teclas, true)
    velo.onclick = (e) => { if (e.target === velo) cerrar(false) }
    velo.querySelectorAll('[data-r]').forEach(b => { b.onclick = () => cerrar(b.dataset.r === '1') })
  })
}

const confirmar = (titulo, cuerpo, aceptar, peligro) =>
  dialogo({ titulo, cuerpo, aceptar, peligro }).then(r => r !== null)
const pedir = (titulo, cuerpo, valor) => dialogo({ titulo, cuerpo, campo: valor, aceptar: 'Guardar' })


// ------------------------------------------------------- revisar el dibujo
// Tres senales de que una manzana quedo mal generada por OpenStreetMap.
// El resultado se cachea porque recalcular el perimetro en cada redibujo
// del mapa seria carisimo; se limpia cuando la manzana se edita.
// Manzanas que en OpenStreetMap caen mayormente sobre suelo donde no vive
// nadie: plazas, canchas, campus, fincas. Calculado aparte y guardado en
// public/datos/sin-viviendas.json; aca solo se consulta.
let SIN_VIVIENDAS = new Map()
const NOMBRE_SUELO = {
  'leisure=park': 'plaza o parque',
  'leisure=pitch': 'cancha',
  'leisure=sports_centre': 'club deportivo',
  'leisure=stadium': 'estadio',
  'leisure=track': 'pista',
  'leisure=playground': 'juegos infantiles',
  'leisure=garden': 'jardin',
  'leisure=recreation_ground': 'predio recreativo',
  'landuse=grass': 'espacio verde',
  'landuse=farmland': 'finca',
  'landuse=vineyard': 'vinedo',
  'landuse=orchard': 'finca frutal',
  'landuse=forest': 'monte',
  'landuse=cemetery': 'cementerio',
  'landuse=reservoir': 'embalse',
  'landuse=basin': 'cuenca',
  'landuse=brownfield': 'terreno baldio',
  'landuse=recreation_ground': 'predio recreativo',
  'landuse=education': 'predio educativo',
  'amenity=university': 'universidad',
  'amenity=college': 'instituto',
  'amenity=school': 'escuela',
  'amenity=kindergarten': 'jardin de infantes',
  'amenity=hospital': 'hospital',
  'amenity=community_centre': 'centro comunitario',
  'natural=water': 'agua',
  'natural=sand': 'arenal',
}
const nombreSuelo = (q) => NOMBRE_SUELO[q] || q

const RADIO = 6378137
const arad = (d) => d * Math.PI / 180

function perimetro (anillo) {
  let p = 0
  for (let i = 0; i < anillo.length - 1; i++) {
    const a = anillo[i], b = anillo[i + 1]
    const dx = arad(b[0] - a[0]) * Math.cos(arad((a[1] + b[1]) / 2)) * RADIO
    const dy = arad(b[1] - a[1]) * RADIO
    p += Math.hypot(dx, dy)
  }
  return p
}

function diagnosticar (m) {
  // Dada por buena a mano: no vuelve a aparecer en ningun lado.
  if (revisadas.has(m.id)) return null
  if (m.__diag !== undefined) return m.__diag
  const anillo = m.geom.coordinates[0]
  const a = area(feat(m.geom))
  const v = anillo.length - 1
  const p = perimetro(anillo)
  // Compacidad de Polsby-Popper: 1 es un circulo, una manzana normal ronda 0,7.
  const comp = p ? (4 * Math.PI * a) / (p * p) : 0

  let d = null
  const sv = SIN_VIVIENDAS.get(m.id)
  // Va primero: que una plaza sea grande o rara es lo de menos, el punto es
  // que ahi no hay a quien visitar.
  if (sv && !m.editada) {
    d = { tipo: 'sinviviendas', txt: `${nombreSuelo(sv.q)} \u00b7 ${Math.round(sv.f * 100)}% sin viviendas` }
  }
  else if (a > 40000) d = { tipo: 'gigante', txt: `${(a / 10000).toFixed(1)} ha · cubre varias manzanas` }
  else if (comp < 0.25 && a > 3000) d = { tipo: 'rara', txt: `forma irregular · compacidad ${comp.toFixed(2)}` }
  else if (v > 40) d = { tipo: 'detalle', txt: `${v} vértices · demasiado detalle` }

  m.__diag = d
  return d
}

const limpiarDiag = (m) => { delete m.__diag }

// ------------------------------------------------------- editar vertices
// Editor propio, sin leaflet-draw: tiradores arrastrables sobre cada vertice,
// puntos intermedios para agregar, y clic derecho para quitar.
function terminarEdicion () {
  if (!edicion) return
  capaEdicion.clearLayers()
  edicion = null
  refrescar()
}

function anilloDe (m) {
  const a = m.geom.coordinates[0]
  // GeoJSON cierra el anillo repitiendo el primer punto; se trabaja sin el.
  return a.length > 1 && a[0][0] === a[a.length - 1][0] && a[0][1] === a[a.length - 1][1]
    ? a.slice(0, -1) : a.slice()
}

function guardarAnillo (m, pts) {
  if (pts.length < 3) return false
  m.geom = { type: 'Polygon', coordinates: [[...pts, pts[0]]] }
  m.editada = true
  limpiarDiag(m)
  return true
}

function iniciarEdicion (idManzana) {
  terminarEdicion()
  const m = manzanas.get(idManzana)
  if (!m) return
  let pts = anilloDe(m)

  const contorno = L.polygon(pts.map(([x, y]) => [y, x]),
    { color: '#5554F2', weight: 2.5, fillColor: '#5554F2', fillOpacity: .18, interactive: false })
  capaEdicion.addLayer(contorno)

  const repintar = () => {
    contorno.setLatLngs(pts.map(([x, y]) => [y, x]))
    dibujarTiradores()
  }

  function dibujarTiradores () {
    capaEdicion.eachLayer(l => { if (l !== contorno) capaEdicion.removeLayer(l) })

    pts.forEach((p, i) => {
      const mk = L.marker([p[1], p[0]], { draggable: true, zIndexOffset: 1000,
        icon: L.divIcon({ className: 'vert', iconSize: [13, 13], iconAnchor: [6.5, 6.5] }) })
      mk.on('drag', (ev) => { const ll = ev.target.getLatLng(); pts[i] = [ll.lng, ll.lat]; contorno.setLatLngs(pts.map(([x, y]) => [y, x])) })
      mk.on('dragend', () => { instantanea(); guardarAnillo(m, pts); guardar(); repintar() })
      mk.on('contextmenu', (ev) => {
        L.DomEvent.stop(ev)
        if (pts.length <= 3) return avisar('Una manzana necesita al menos 3 vértices.')
        instantanea(); pts.splice(i, 1); guardarAnillo(m, pts); guardar(); repintar()
      })
      capaEdicion.addLayer(mk)
    })

    // puntos intermedios: agregan un vertice donde se los toca
    pts.forEach((p, i) => {
      const q = pts[(i + 1) % pts.length]
      const medio = [(p[0] + q[0]) / 2, (p[1] + q[1]) / 2]
      const mk = L.marker([medio[1], medio[0]], { zIndexOffset: 900,
        icon: L.divIcon({ className: 'vert-medio', iconSize: [9, 9], iconAnchor: [4.5, 4.5] }) })
      mk.on('click', (ev) => {
        L.DomEvent.stop(ev)
        instantanea(); pts.splice(i + 1, 0, medio); guardarAnillo(m, pts); guardar(); repintar()
      })
      capaEdicion.addLayer(mk)
    })
  }

  edicion = { id: idManzana }
  dibujarTiradores()
  avisar(`Editando una manzana de <b>${Math.round(area(feat(m.geom)))} m²</b>. Arrastrá los puntos, tocá los claros para agregar, clic derecho para quitar. <b>Esc</b> termina.`)
}

// ------------------------------------------------------- dibujar manzana
// Para las zonas donde OpenStreetMap no tiene las calles y no hay manzana.
function cancelarDibujo () {
  dibujo = []
  capaDibujo.clearLayers()
}

// El iman trabaja en pixeles, no en grados: a 12 px de distancia se siente
// igual en cualquier zoom, y comparar grados cerca del ecuador o lejos no.
// Los vecinos se pasan a pixeles una sola vez y no en cada movimiento del mouse.
const RADIO_ANCLA = 13
const RADIO_LADO = 9
const RADIO_CIERRE = 14

function prepararIman () {
  anclas = []; lados = []
  if (herramienta !== 'dibujar') return
  const lim = mapa.getBounds().pad(0.1)
  for (const m of manzanas.values()) {
    const anillo = m.geom.coordinates[0]
    if (!dentro(anillo, lim)) continue
    const pts = anillo.map(([x, y]) => mapa.latLngToLayerPoint(L.latLng(y, x)))
    for (let i = 0; i < anillo.length - 1; i++) {
      anclas.push({ p: pts[i], ll: anillo[i] })
      lados.push({ a: pts[i], b: pts[i + 1] })
    }
  }
}

function aLatLng (p) { const l = mapa.layerPointToLatLng(p); return [l.lng, l.lat] }

// Devuelve donde cae realmente el punto y por que: vertice, lado o libre.
function ajustar (latlng) {
  const p = mapa.latLngToLayerPoint(latlng)
  if (!iman) return { pt: [latlng.lng, latlng.lat], tipo: 'libre' }

  let mejor = null, dist = RADIO_ANCLA
  for (const a of anclas) {
    const d = p.distanceTo(a.p)
    if (d < dist) { dist = d; mejor = a }
  }
  if (mejor) return { pt: [...mejor.ll], tipo: 'vertice' }

  let mejorL = null, distL = RADIO_LADO
  for (const l of lados) {
    const vx = l.b.x - l.a.x, vy = l.b.y - l.a.y
    const largo = vx * vx + vy * vy
    if (!largo) continue
    let t = ((p.x - l.a.x) * vx + (p.y - l.a.y) * vy) / largo
    t = Math.max(0, Math.min(1, t))
    const q = L.point(l.a.x + t * vx, l.a.y + t * vy)
    const d = p.distanceTo(q)
    if (d < distL) { distL = d; mejorL = q }
  }
  if (mejorL) return { pt: aLatLng(mejorL), tipo: 'lado' }

  return { pt: [latlng.lng, latlng.lat], tipo: 'libre' }
}

// Si el cursor esta encima del primer punto, el proximo clic cierra la figura.
function cierraAca (latlng) {
  if (dibujo.length < 3) return false
  const p = mapa.latLngToLayerPoint(latlng)
  const q = mapa.latLngToLayerPoint(L.latLng(dibujo[0][1], dibujo[0][0]))
  return p.distanceTo(q) < RADIO_CIERRE
}

function pintarDibujo (previo = null, tipoPrevio = 'libre', cerrando = false) {
  capaDibujo.clearLayers()
  if (!dibujo.length) return

  const linea = dibujo.map(([x, y]) => [y, x])
  if (previo && !cerrando) linea.push([previo[1], previo[0]])
  if (linea.length > 1) {
    capaDibujo.addLayer(L.polyline(linea, { color: '#FA5D27', weight: 2.5, dashArray: '5,4', interactive: false }))
  }
  // Con 3 puntos ya se ve el relleno que va a quedar.
  if (dibujo.length >= 2 && (previo || cerrando)) {
    const cara = cerrando ? dibujo : [...dibujo, previo]
    if (cara.length >= 3) {
      capaDibujo.addLayer(L.polygon(cara.map(([x, y]) => [y, x]),
        { color: '#FA5D27', weight: 0, fillColor: '#FA5D27', fillOpacity: .18, interactive: false }))
    }
  }

  dibujo.forEach(([x, y], i) => capaDibujo.addLayer(
    L.circleMarker([y, x], {
      radius: i === 0 && cerrando ? 8 : 4.5,
      color: '#FA5D27', weight: i === 0 && cerrando ? 3 : 2,
      fillColor: i === 0 && cerrando ? '#FA5D27' : '#fff',
      fillOpacity: 1, interactive: false,
    })))

  // El punto fantasma dice de antemano donde va a caer y si se pego a algo.
  if (previo && !cerrando) {
    const pegado = tipoPrevio !== 'libre'
    capaDibujo.addLayer(L.circleMarker([previo[1], previo[0]], {
      radius: pegado ? 6.5 : 4,
      color: pegado ? '#01BC73' : '#888a8b',
      weight: pegado ? 3 : 1.5,
      fillColor: '#fff', fillOpacity: 1, interactive: false,
    }))
  }
}

function cerrarDibujo () {
  if (dibujo.length < 3) return avisar('Necesitás al menos <b>3 puntos</b> para cerrar una manzana.')
  instantanea()
  const id = 'm' + Date.now().toString(36)
  manzanas.set(id, {
    id, geom: { type: 'Polygon', coordinates: [[...dibujo, dibujo[0]]] },
    territorio: activo || null, editada: true,
  })
  if (activo) { sellarOrden(manzanas.get(id)); reletrar(activo) }
  const m2 = Math.round(area(feat(manzanas.get(id).geom)))
  cancelarDibujo()
  refrescar()
  prepararIman()
  avisar(`Manzana nueva de <b>${m2} m²</b>` + (activo
    ? ` sumada al territorio <b>${territorios.get(activo).numero}</b>. Seguí dibujando la siguiente.`
    : '. No hay territorio activo, quedó suelta.'))
}

function puntoDeDibujo (latlng) {
  // Clic sobre el primer punto: se cierra la manzana, que es lo que uno espera.
  if (cierraAca(latlng)) return cerrarDibujo()
  dibujo.push(ajustar(latlng).pt)
  pintarDibujo()
  pistaDibujo()
}

function pistaDibujo () {
  if (!dibujo.length) return avisar('<b>Dibujar manzana:</b> hacé clic para poner los puntos. Con el <b>imán</b> se pegan a las esquinas de las manzanas vecinas.')
  avisar(`<b>${dibujo.length} punto${dibujo.length === 1 ? '' : 's'}</b>. ` +
    (dibujo.length >= 3 ? 'Hacé clic en el <b>primer punto</b> para cerrar, o <b>Enter</b>. ' : '') +
    '<b>Retroceso</b> borra el último, <b>Esc</b> cancela.')
}

// ------------------------------------------------- traer del sistema actual
// Lee el respaldo JSON que ya exporta la app (boton "Exportar" del modulo
// Mapas) y reconstruye el modelo por manzana sin pedir un solo clic:
//   - el poligono dibujado de cada territorio define QUE manzanas le tocan
//   - los puntos de manzana con letra que ya cargaste definen COMO se llaman
function bbox (anillo) {
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity
  for (const [x, y] of anillo) {
    if (x < x0) x0 = x; if (x > x1) x1 = x
    if (y < y0) y0 = y; if (y > y1) y1 = y
  }
  return [x0, y0, x1, y1]
}
const enBbox = (p, b) => p[0] >= b[0] && p[0] <= b[2] && p[1] >= b[1] && p[1] <= b[3]

let SECTORES = {}   // numero de territorio -> sector, sacado del PDF oficial

// Se llama UNA sola vez, al abrir el editor en un navegador sin nada
// guardado. Tuvo un boton para volver a correrla a mano y se saco: el
// sistema ya esta importado y lo unico que podia hacer ese boton era
// borrar 69 territorios de trabajo.
function traerDelSistema (respaldo) {
  const registros = respaldo.records || []
  if (!registros.length) return avisar('Ese archivo no tiene territorios.')

  instantanea()
  territorios.clear()
  for (const m of manzanas.values()) { m.territorio = null; delete m.letra }

  // Centroide de cada manzana, una sola vez.
  const centros = new Map()
  for (const m of manzanas.values()) {
    centros.set(m.id, centroid(feat(m.geom)).geometry.coordinates)
  }

  const informe = { territorios: 0, asignadas: 0, conflictos: [], sinLetra: 0, letrasPerdidas: [], letrasAjenas: [] }
  const dueno = new Map()   // idManzana -> idTerritorio, para detectar solapamientos
  const idPorRegistro = new Map()  // id del respaldo -> id nuevo, sin depender del orden

  registros.forEach((r, i) => {
    const geom = r.polygon_geojson
    if (!geom || geom.type !== 'Polygon') return

    const id = 't' + i.toString(36) + Date.now().toString(36)
    idPorRegistro.set(r.id ?? i, id)
    // El nombre suele traer el numero adelante; si no, se usa el nombre entero.
    const m = String(r.name || '').match(/\d+/)
    const numero = m ? m[0] : String(r.name || i + 1).slice(0, 6)
    territorios.set(id, {
      id, numero,
      // El sector sale del PDF "Mapa x Sectores"; los territorios posteriores
      // al PDF (60 a 69) se dedujeron por cercania a los ya conocidos.
      sector: SECTORES[numero] || 'I',
      color: r.color || PALETA[territorios.size % PALETA.length],
    })
    informe.territorios++

    const caja = bbox(geom.coordinates[0])
    const poli = feat(geom)

    for (const mz of manzanas.values()) {
      const c = centros.get(mz.id)
      if (!enBbox(c, caja)) continue
      if (!booleanPointInPolygon(c, poli)) continue

      if (dueno.has(mz.id)) {
        // Dos territorios dibujados se pisan: hoy el sistema lo permite.
        const otro = territorios.get(dueno.get(mz.id))
        informe.conflictos.push(`${otro.numero} / ${territorios.get(id).numero}`)
        continue
      }
      dueno.set(mz.id, id)
      mz.territorio = id
      informe.asignadas++
    }
  })

  // Las letras que ya cargaste mandan sobre el orden automatico.
  registros.forEach((r, i) => {
    const idT = idPorRegistro.get(r.id ?? i)
    if (!idT) return
    for (const b of r.blocks || []) {
      const p = [Number(b.lng), Number(b.lat)]
      let encontrada = null
      for (const mz of manzanas.values()) {
        if (!enBbox(p, bbox(mz.geom.coordinates[0]))) continue
        if (booleanPointInPolygon(p, feat(mz.geom))) { encontrada = mz; break }
      }
      if (!encontrada) { informe.letrasPerdidas.push(b.label); continue }

      // La manzana quedo en otro territorio. No es un solapamiento: pasa cuando
      // tu punto esta cerca del borde y el centroide de la manzana OSM cae del
      // otro lado. Es una diferencia de borde entre tu dibujo y la manzana real.
      if (encontrada.territorio && encontrada.territorio !== idT) {
        informe.letrasAjenas.push(`${b.label} de ${territorios.get(idT).numero}`)
        continue
      }
      if (!encontrada.territorio) { encontrada.territorio = idT; informe.asignadas++ }
      encontrada.letra = b.label
      encontrada.letraManual = true
    }
  })

  // Las manzanas sin letra manual se numeran solas, respetando las que vinieron.
  for (const t of territorios.values()) {
    const propias = [...manzanas.values()].filter(x => x.territorio === t.id)
    const usadas = new Set(propias.filter(x => x.letraManual).map(x => x.letra))
    const libres = LETRAS.split('').filter(l => !usadas.has(l))
    const sinLetra = propias.filter(x => !x.letraManual)
    sinLetra.forEach(x => { x.__c = centroid(feat(x.geom)).geometry.coordinates })
    sinLetra.sort((a, b) => (b.__c[1] - a.__c[1]) || (a.__c[0] - b.__c[0]))
    sinLetra.forEach((x, k) => { x.letra = libres[k] || '?'; delete x.__c })
    informe.sinLetra += sinLetra.length
  }

  activo = null
  refrescar()

  const conf = informe.conflictos.length
  avisar(`Traídos <b>${informe.territorios} territorios</b> y <b>${informe.asignadas} manzanas</b>.` +
    (informe.letrasPerdidas.length ? `<br>${icono('error')} ${informe.letrasPerdidas.length} manzanas tuyas no caen en ninguna manzana de OSM.` : '') +
    (conf ? `<br>${icono('error')} ${conf} solapamientos entre territorios dibujados.` : '') +
    (informe.letrasAjenas.length ? `<br>${icono('error')} ${informe.letrasAjenas.length} manzanas tuyas caen en el territorio de al lado (diferencia de borde).` : '') +
    (informe.sinLetra ? `<br>${informe.sinLetra} manzanas de OSM dentro de tus territorios que vos no tenías cargadas.` : ''))
  console.log('Informe de importación:', informe)
}

// ---------------------------------------------------------------- controles
document.getElementById('bCrear').onclick = () => {
  const numero = document.getElementById('nNum').value.trim()
  if (!numero) return avisar('Poné un número de territorio.')
  if ([...territorios.values()].some(t => t.numero === numero)) return avisar(`Ya existe el territorio ${numero}.`)
  instantanea()
  const id = 't' + Date.now().toString(36)
  territorios.set(id, { id, numero, sector: document.getElementById('nSec').value, color: PALETA[territorios.size % PALETA.length] })
  activo = id
  document.getElementById('nNum').value = ''
  refrescar()
  avisar(`Territorio <b>${numero}</b> creado. Hacé clic en las manzanas para sumarlas.`)
}

document.getElementById('bBorrar').onclick = async () => {
  if (!activo) return
  const t = territorios.get(activo)
  const n = [...manzanas.values()].filter(m => m.territorio === activo).length
  if (!await confirmar(`Borrar el territorio ${t.numero}`,
    `Desaparece el territorio y se pierde el número <b>${t.numero}</b>. Sus <b>${n}</b> manzanas quedan libres.` +
    `<br><br>Si solo querés rearmarlo conservando el número, usá <b>Redibujar desde cero</b>.`,
    'Borrar', true)) return
  instantanea()
  for (const m of manzanas.values()) if (m.territorio === activo) { m.territorio = null; delete m.letra }
  territorios.delete(activo)
  activo = null
  refrescar()
}

// Vaciar un territorio conservando su identidad: numero, sector y color quedan.
// Ademas se deshacen los cortes y ediciones hechos sobre SUS manzanas, para
// arrancar con las manzanas tal cual vinieron del archivo.
document.getElementById('bRedibujar').onclick = async () => {
  if (!activo) return
  const t = territorios.get(activo)
  const propias = [...manzanas.values()].filter(m => m.territorio === activo)
  if (!propias.length) return avisar(`El territorio <b>${t.numero}</b> ya está vacío. Hacé clic en las manzanas para armarlo.`)

  const tocadas = propias.filter(m => m.editada).length
  const ok = await confirmar(
    `Redibujar el territorio ${t.numero}`,
    `Se sueltan sus <b>${propias.length} manzanas</b>` +
    (tocadas ? ` y se deshacen los <b>${tocadas}</b> cortes o ediciones hechos sobre ellas` : '') +
    `. El número <b>${t.numero}</b>, el sector y el color se conservan.<br><br>Se puede deshacer con Cmd+Z.`,
    'Vaciar y redibujar', true)
  if (!ok) return

  instantanea()
  for (const m of propias) {
    if (!GEOM_ORIGINAL.has(m.id)) { manzanas.delete(m.id); continue }
    m.geom = GEOM_ORIGINAL.get(m.id)
    delete m.editada
    delete m.__diag
    m.territorio = null
    delete m.letra
    delete m.orden
  }
  paraFusionar = []; cortePuntos = []; edicion = null; dibujo = []
  capaEdicion.clearLayers(); capaCorte.clearLayers(); capaDibujo.clearLayers()
  refrescar()
  avisar(`Territorio <b>${t.numero}</b> vacío y listo. Hacé clic en las manzanas para volver a armarlo. <b>Cmd+Z</b> lo deja como estaba.`)
}

// Insertar un territorio nuevo despues de este, corriendo la numeracion.
// Sirve cuando aparece un territorio entre dos ya numerados y no se quiere
// renumerar a mano de ahi en adelante.
document.getElementById('bDerivar').onclick = async () => {
  if (!activo) return
  const t = territorios.get(activo)
  const n = parseInt(t.numero, 10)
  if (!Number.isInteger(n) || String(n) !== t.numero.trim()) {
    return avisar(`El territorio <b>${t.numero}</b> no tiene un número correlativo, así que no se puede insertar uno después. Usá <b>Crear</b> arriba.`)
  }
  const nuevo = n + 1

  // Solo se corren los de numeracion corrida; los tipo "20b" se quedan quietos.
  const corridos = [...territorios.values()]
    .filter(x => String(parseInt(x.numero, 10)) === x.numero.trim() && parseInt(x.numero, 10) >= nuevo)
  const raros = [...territorios.values()].filter(x => String(parseInt(x.numero, 10)) !== x.numero.trim())

  const ok = await confirmar(
    `Nuevo territorio ${nuevo}`,
    `Se crea el territorio <b>${nuevo}</b> vacío, en el sector <b>${t.sector}</b>.` +
    (corridos.length
      ? `<br><br>Los <b>${corridos.length}</b> territorios del ${nuevo} en adelante suben un número: el ${nuevo} pasa a ser ${nuevo + 1}, y así hasta el último.`
      : `<br><br>No hay territorios posteriores, así que no se corre ninguno.`) +
    (raros.length ? `<br><br><b>${raros.length}</b> con número no correlativo (${raros.slice(0, 3).map(x => x.numero).join(', ')}) quedan como están.` : '') +
    `<br><br>Se puede deshacer con Cmd+Z.`,
    `Crear el ${nuevo}`)
  if (!ok) return

  instantanea()
  // Se calcula sobre el numero viejo, asi que el orden del recorrido da igual.
  corridos.forEach(x => { x.numero = String(parseInt(x.numero, 10) + 1) })

  const id = 't' + Date.now().toString(36)
  territorios.set(id, { id, numero: String(nuevo), sector: t.sector, color: PALETA[territorios.size % PALETA.length] })
  activo = id

  // Queda listo para marcar, que es lo que se va a hacer enseguida.
  document.querySelector('.herr button[data-h="marcar"]').click()
  refrescar()
  avisar(`Territorio <b>${nuevo}</b> creado y vacío${corridos.length ? `, y ${corridos.length} territorios corridos un número` : ''}. Hacé clic en las manzanas para armarlo.`)
}

document.querySelectorAll('#chipsLetras button').forEach(b => {
  b.onclick = () => {
    if (!activo) return
    const t = territorios.get(activo)
    // "A mano" no es un orden automatico: abre la herramienta para que la
    // persona toque las manzanas en el orden que quiere.
    if (b.dataset.l === 'mano') {
      return document.querySelector('.herr button[data-h="letras"]').click()
    }
    if ((t.letras || 'orden') === b.dataset.l) return
    instantanea()
    t.letras = b.dataset.l
    // Pasar a "como marco" sin orden registrado no cambiaria nada, asi que se
    // les sella uno ahora, respetando el orden geografico que ya tenian.
    if (t.letras === 'orden') {
      const sinOrden = [...manzanas.values()].filter(m => m.territorio === activo && m.orden == null)
      if (sinOrden.length) {
        sinOrden.forEach(m => { m.__c = centroid(feat(m.geom)).geometry.coordinates })
        sinOrden.sort((a, b) => (b.__c[1] - a.__c[1]) || (a.__c[0] - b.__c[0]))
        sinOrden.forEach(m => { m.orden = ordenSiguiente++; delete m.__c })
      }
    }
    reletrar(activo)
    refrescar()
    avisar(t.letras === 'orden'
      ? 'Las letras siguen ahora el <b>orden en que vas marcando</b>. Las que sumes van al final.'
      : 'Las letras se reordenaron <b>por cercanía</b>: de norte a sur y de oeste a este.')
  }
})

// Acciones en grupo: una sola entrada en el historial, se deshacen juntas.
function enGrupo (borrar) {
  const ids = [...mzSel]
  if (!ids.length) return
  instantanea()
  for (const id of ids) {
    const m = manzanas.get(id)
    if (!m) continue
    if (borrar) { manzanas.delete(id); descartadas.add(id) }
    else { m.territorio = null; delete m.letra; delete m.orden }
  }
  const t = territorios.get(activo)
  mzSel.clear()
  reletrar(activo)
  refrescar()
  avisar(borrar
    ? `<b>${ids.length}</b> manzanas borradas del prototipo. <b>Cmd+Z</b> las devuelve.`
    : `<b>${ids.length}</b> manzanas sacadas del territorio ${t.numero}. Siguen en el mapa, libres. <b>Cmd+Z</b> las devuelve.`)
}

document.getElementById('bRenom').onclick = async () => {
  if (!activo) return
  const t = territorios.get(activo)
  const n = await pedir('Renumerar', `Nuevo número para el territorio <b>${t.numero}</b>.`, t.numero)
  if (!n) return
  if ([...territorios.values()].some(x => x.id !== activo && x.numero === n)) {
    return avisar(`Ya existe el territorio <b>${n}</b>. Elegí otro número.`)
  }
  instantanea(); t.numero = n; refrescar()
}

// Dividir un territorio NO toca geometria: se reparten sus manzanas.
document.getElementById('bDividirT').onclick = async () => {
  if (!activo) return
  const t = territorios.get(activo)
  const propias = [...manzanas.values()].filter(m => m.territorio === activo)
  if (propias.length < 2) return avisar('Necesita al menos 2 manzanas para dividirse.')
  const n = await pedir('Dividir territorio',
    `El territorio nuevo se lleva la mitad sur de las <b>${propias.length}</b> manzanas del ${t.numero}. ¿Qué número le ponemos?`,
    t.numero + 'b')
  if (!n) return
  if ([...territorios.values()].some(x => x.numero === n)) return avisar(`Ya existe el territorio <b>${n}</b>.`)
  instantanea()
  const id = 't' + Date.now().toString(36)
  territorios.set(id, { id, numero: n.trim(), sector: t.sector, color: PALETA[territorios.size % PALETA.length] })
  propias.forEach(m => { m.__c = centroid(feat(m.geom)).geometry.coordinates })
  propias.sort((a, b) => b.__c[1] - a.__c[1])
  propias.slice(Math.ceil(propias.length / 2)).forEach(m => { m.territorio = id })
  propias.forEach(m => delete m.__c)
  reletrar(activo); reletrar(id)
  refrescar()
  avisar(`Dividido en <b>${t.numero}</b> y <b>${n}</b>.`)
}

document.querySelectorAll('.herr button').forEach(b => {
  b.onclick = () => {
    // Tocar de nuevo la herramienta activa vuelve a neutro.
    if (b.dataset.h === herramienta && herramienta !== 'ver' && !dibujo.length) {
      return document.querySelector('.herr button[data-h="ver"]').click()
    }
    // Poner letras a medio camino tampoco se tira sin avisar.
    if (letrasNuevas.length && b.dataset.h !== 'letras') {
      return avisar(`Llevás <b>${letrasNuevas.length}</b> manzana${letrasNuevas.length === 1 ? '' : 's'} con letra nueva. ` +
        '<b>Enter</b> aplica, <b>Esc</b> cancela.')
    }
    // Un dibujo empezado no se tira sin avisar: se cierra o se descarta a mano.
    if (dibujo.length && b.dataset.h !== 'dibujar') {
      return avisar(`Tenés una manzana a medio dibujar con <b>${dibujo.length} punto${dibujo.length === 1 ? '' : 's'}</b>. ` +
        '<b>Enter</b> la cierra, <b>Esc</b> la descarta.')
    }
    document.querySelectorAll('.herr button').forEach(x => x.classList.remove('on'))
    b.classList.add('on')
    herramienta = b.dataset.h
    // La herramienta elegida se recuerda: al recargar no vuelve sola a "marcar".
    try { localStorage.setItem(CLAVE + ':herr', herramienta) } catch (e) { /* sin espacio */ }
    paraFusionar = []; cortePuntos = []; capaCorte.clearLayers()
    terminarEdicion(); cancelarDibujo()
    const ayuda = {
      ver: 'Modo <b>solo mirar</b>: hacé clic en una manzana para ver su ficha. Nada se modifica. Elegí una herramienta para editar.',
      marcar: 'Las <b>azules</b> son manzanas de OpenStreetMap todavía sin territorio. Hacé clic para sumarlas.',
      dividir: 'Marcá <b>dos puntos</b> que crucen la manzana entera para partirla.',
      fusionar: 'Elegí <b>dos manzanas vecinas</b> para unirlas en una.',
      mover: 'Hacé clic en cualquier manzana para <b>pasarla</b> al territorio activo, aunque sea de otro.',
      editar: 'Hacé clic en una manzana para <b>mover sus vértices</b>. Los puntos claros agregan uno nuevo; clic derecho borra. <b>Esc</b> termina.',
      dibujar: '<b>Dibujar manzana:</b> hacé clic para poner los puntos. Con el <b>imán</b> se pegan a las esquinas de las manzanas vecinas.',
      borrar: 'Hacé clic en una manzana para <b>borrarla</b> del prototipo. <b>Cmd+Z</b> la devuelve.',
      letras: 'Tocá las manzanas en el <b>orden</b> que querés que queden: la primera va a ser la <b>A</b>, la segunda la <b>B</b>. <b>Enter</b> aplica lo que llevás, <b>Esc</b> cancela.',
      caras: 'Cada manzana muestra sus <b>caras</b>. Los puntos <b>llenos</b> son las uniones: tocá uno para <b>unir</b> las dos caras. Los <b>huecos</b> parten la cara ahí. <b>Cmd+Z</b> vuelve atrás.',
    }
    avisar(herramienta === 'caras' && activo ? ayuda.caras + '<br>' + resumenCaras() : ayuda[herramienta])
    pintarCaras()
    pintarLetrasNuevas()
    cerrarBurbuja()
    // El iman necesita los vecinos ya pasados a pixeles antes del primer clic.
    prepararIman()
    refrescarMapa()
  }
})

addEventListener('beforeunload', (e) => {
  if (manejadorArchivo) return
  if (!descartadas.size && !revisadas.size && ![...manzanas.values()].some(m => m.editada)) return
  e.preventDefault()
  e.returnValue = ''
})

document.getElementById('bExport').onclick = () => {
  const datos = {
    generado: new Date().toISOString(),
    territorios: [...territorios.values()],
    manzanas: [...manzanas.values()].filter(m => m.territorio).map(m => ({
      id: m.id, letra: m.letra, territorio: m.territorio, geometria: m.geom,
    })),
  }
  const a = document.createElement('a')
  a.href = URL.createObjectURL(new Blob([JSON.stringify(datos, null, 2)], { type: 'application/json' }))
  a.download = 'territorios.json'
  a.click()
}

document.getElementById('bImport').onclick = () => document.getElementById('fImport').click()
document.getElementById('fImport').onchange = async (e) => {
  const f = e.target.files[0]; if (!f) return
  const d = JSON.parse(await f.text())
  instantanea()
  territorios = new Map((d.territorios || []).map(t => [t.id, t]))
  for (const m of manzanas.values()) { m.territorio = null; delete m.letra }
  for (const mm of d.manzanas || []) {
    const m = manzanas.get(mm.id) || { id: mm.id, geom: mm.geometria, editada: true }
    m.geom = mm.geometria; m.territorio = mm.territorio
    manzanas.set(m.id, m)
  }
  territorios.forEach(t => reletrar(t.id))
  activo = null; refrescar()
}

document.getElementById('bReset').onclick = async () => {
  if (!await confirmar('Vaciar el editor',
    'Se borran <b>todos</b> los territorios de este editor. La base de datos de la app no se toca.',
    'Vaciar todo', true)) return
  instantanea()
  territorios.clear()
  for (const m of manzanas.values()) { m.territorio = null; delete m.letra }
  activo = null
  localStorage.removeItem(CLAVE)
  refrescar()
}

addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return
  // Con un dialogo abierto el teclado es del dialogo, no del mapa.
  if (document.querySelector('.velo')) return

  const conMando = e.metaKey || e.ctrlKey

  // Deshacer y rehacer.
  if (conMando && e.key.toLowerCase() === 'z') {
    e.preventDefault()
    // Estando a medio dibujar, Cmd+Z saca el ULTIMO PUNTO. Antes se iba al
    // historial y borraba la manzana anterior, que ya estaba bien cerrada.
    if (herramienta === 'dibujar' && dibujo.length) {
      dibujo.pop(); pintarDibujo(); pistaDibujo()
      return
    }
    // Igual que con el dibujo: con letras a medio poner, Cmd+Z saca la
    // ultima que tocaste, no el paso anterior del historial.
    if (herramienta === 'letras' && letrasNuevas.length) {
      letrasNuevas = letrasNuevas.slice(0, -1)
      pintarLetrasNuevas()
      return
    }
    if (e.shiftKey) rehacer(); else deshacer()
    return
  }

  if (e.key === 'Escape') {
    // Se va soltando de a una cosa por vez, de lo mas chico a lo mas grande:
    // primero el gesto en curso, y recien al final el territorio.
    if (dibujo.length) { cancelarDibujo(); avisar('Dibujo descartado.'); return }
    if (cancelarLetras()) return
    if (burbuja) { cerrarBurbuja(); return }
    if (edicion) { terminarEdicion(); return }
    if (paraFusionar.length) { paraFusionar = []; refrescarMapa(); return }
    if (cortePuntos.length) { cortePuntos = []; capaCorte.clearLayers(); return }
    // Salir de la herramienta: es lo que hace falta para dejar de dibujar,
    // borrar o marcar sin querer con el proximo clic.
    if (herramienta !== 'ver') {
      document.querySelector('.herr button[data-h="ver"]').click()
      return
    }
    if (activo) deseleccionar()
    return
  }

  if (herramienta === 'letras' && letrasNuevas.length && e.key === 'Enter') {
    e.preventDefault(); aplicarLetrasNuevas(); return
  }

  if (herramienta === 'dibujar' && dibujo.length) {
    if (e.key === 'Enter') { e.preventDefault(); cerrarDibujo(); return }
    if (e.key === 'Backspace') { e.preventDefault(); dibujo.pop(); pintarDibujo(); pistaDibujo(); return }
  }

  // Cambio de herramienta. No con Cmd/Ctrl: eso es un atajo del navegador.
  const map = { 1: 'dibujar', 2: 'dividir', 3: 'fusionar', 4: 'mover', 5: 'editar', 6: 'marcar', 7: 'borrar', 8: 'caras', 9: 'letras' }
  if (map[e.key] && !conMando) document.querySelector(`.herr button[data-h="${map[e.key]}"]`).click()
})

/* ====================================================================
   LAS CARAS
   --------------------------------------------------------------------
   Una cara es la tira de segmentos casi colineales que dan la vuelta a
   una misma calle: lo que un hermano llama "una cuadra".

   Hasta hoy las caras no existian en el editor. Se calculaban al cargar
   el dibujo en la base y el que dibujaba nunca las veia: de 605
   manzanas, 400 daban 4 caras y 205 daban otra cosa, sin forma de saber
   cuales estaban mal ni de corregirlas.

   Este calculo es UNA COPIA EXACTA del de scripts/cargar-geometrias-y-
   lados.mjs y del de la vista del hermano. Si se separan, el editor
   muestra una cosa y la base guarda otra, y la cobertura apunta a otra
   calle. Cualquier cambio va en los tres.
   ==================================================================== */

const TOL_GRADOS = 25
const LARGO_MINIMO = 12

const mts = (a, b) =>
  Math.hypot((b[1] - a[1]) * Math.cos((a[0] * Math.PI) / 180) * 111320, (b[0] - a[0]) * 110540)
const rmb = (a, b) =>
  (Math.atan2(b[0] - a[0], (b[1] - a[1]) * Math.cos((a[0] * Math.PI) / 180)) * 180) / Math.PI
const difAng = (x, y) => Math.abs((((x - y) + 180) % 360) - 180)

function anilloLatLng (geom) {
  const anillo = geom.coordinates[0].map(([x, y]) => [y, x])
  const cerrado = anillo[0][0] === anillo[anillo.length - 1][0] &&
                  anillo[0][1] === anillo[anillo.length - 1][1]
  return cerrado ? anillo.slice(0, -1) : anillo
}

/* Las caras salen de agrupar segmentos casi colineales. Se calculan en
   INDICES del anillo, no en puntos: un tramo es [i, i+1, ...] y dos
   tramos vecinos comparten el vertice del medio. Guardar la correccion
   de una persona necesita poder nombrar el corte, y un punto suelto no
   sirve para eso.

   Dos tramos vecinos se unen concatenando; un tramo se parte en
   cualquiera de sus vertices interiores. Eso es todo lo que hace falta
   para arreglar a mano lo que el umbral de 25 grados saca mal. */
function tramosAutomaticos (geom) {
  const pts = anilloLatLng(geom)
  const n = pts.length
  if (n < 3) return []
  const rum = (i, j) => rmb(pts[i], pts[j])
  let grupos = [[0, 1 % n]]
  for (let i = 1; i < n; i++) {
    const b = (i + 1) % n
    const g = grupos[grupos.length - 1]
    if (difAng(rum(i, b), rum(g[g.length - 2], g[g.length - 1])) <= TOL_GRADOS) g.push(b)
    else grupos.push([i, b])
  }
  if (grupos.length > 2) {
    const pri = grupos[0]
    const ult = grupos[grupos.length - 1]
    if (difAng(rum(pri[0], pri[1]), rum(ult[ult.length - 2], ult[ult.length - 1])) <= TOL_GRADOS) {
      grupos[0] = ult.concat(pri.slice(1))
      grupos.pop()
    }
  }
  const res = grupos.filter((g) => largoDe(pts, g) >= LARGO_MINIMO)
  return res.length ? res : [grupos[0]]
}

function largoDe (pts, g) {
  let t = 0
  for (let i = 1; i < g.length; i++) t += mts(pts[g[i - 1]], pts[g[i]])
  return t
}

function caraDe (pts, g) {
  const puntos = g.map((i) => pts[i])
  return {
    indices: g,
    puntos,
    largo_m: Number(largoDe(pts, g).toFixed(2)),
    rumbo_grados: Number((((rmb(puntos[0], puntos[puntos.length - 1]) % 180) + 180) % 180).toFixed(2)),
    medio: puntos[Math.floor(puntos.length / 2)],
  }
}

/* Los tramos corregidos a mano se guardan por indice de vertice. Si
   despues se editan los vertices de la manzana, esos indices dejan de
   significar lo mismo: se vuelve al automatico en vez de dibujar
   cualquier cosa. */
function tramosDe (m) {
  const pts = anilloLatLng(m.geom)
  if (m.caras && m.carasN === pts.length) return m.caras
  return tramosAutomaticos(m.geom)
}

function carasDeMz (m) {
  const pts = anilloLatLng(m.geom)
  return tramosDe(m).map((g) => caraDe(pts, g))
}

function areaM2De (geom) {
  const pts = anilloLatLng(geom)
  const lat0 = pts.reduce((t, q) => t + q[0], 0) / pts.length
  const k = Math.cos((lat0 * Math.PI) / 180) * 111320
  let acc = 0
  for (let i = 0; i < pts.length; i++) {
    const a = pts[i]
    const b = pts[(i + 1) % pts.length]
    acc += (a[1] * k) * (b[0] * 110540) - (b[1] * k) * (a[0] * 110540)
  }
  return Number(Math.abs(acc / 2).toFixed(2))
}

function centroDe (geom) {
  const pts = anilloLatLng(geom)
  const n = pts.length
  return [
    Number((pts.reduce((t, q) => t + q[0], 0) / n).toFixed(6)),
    Number((pts.reduce((t, q) => t + q[1], 0) / n).toFixed(6)),
  ]
}

/* La cara se guarda sobre el borde real. Se dibuja corrida hacia adentro
   para que la de esta manzana y la de la de enfrente no caigan encima. */
function corridaAdentro (puntos, centro, metrosAdentro = 7) {
  const [cLat, cLng] = centro
  return puntos.map(([lat, lng]) => {
    const dLat = cLat - lat
    const dLngM = (cLng - lng) * Math.cos((lat * Math.PI) / 180)
    const d = Math.hypot(dLat * 110540, dLngM * 111320) || 1
    const f = metrosAdentro / d
    return [lat + dLat * f, lng + (cLng - lng) * f]
  })
}


function pintarCaras () {
  capaCaras.clearLayers()
  // Las caras se ven solo dentro de su herramienta. Antes habia ademas un
  // tilde en la barra lateral que mostraba lo mismo: dos caminos para una
  // cosa, y el de la herramienta era mejor porque trae el resumen.
  const editando = herramienta === 'caras'
  if (!editando || !activo) return
  const propias = [...manzanas.values()].filter((m) => m.territorio === activo && m.geom)

  for (const m of propias) {
    let pts, tramos
    try { pts = anilloLatLng(m.geom); tramos = tramosDe(m) } catch (e) { continue }
    const centro = centroDe(m.geom)
    const aMano = Boolean(m.caras && m.carasN === pts.length)

    tramos.forEach((g, i) => {
      const cara = caraDe(pts, g)
      L.polyline(corridaAdentro(cara.puntos, centro), {
        color: aMano ? '#7c3aed' : '#0f6b47',
        weight: 4, opacity: 0.85, interactive: false,
      }).addTo(capaCaras)
      L.marker(cara.medio, {
        interactive: false,
        icon: L.divIcon({
          className: '',
          html: '<span style="background:' + (aMano ? '#7c3aed' : '#0f6b47') + ';color:#fff;' +
                'border-radius:9px;padding:0 5px;font:600 10px/16px system-ui;white-space:nowrap">' +
                (i + 1) + '</span>',
          iconSize: [0, 0],
        }),
      }).addTo(capaCaras)
    })

    if (!editando) continue

    // Punto LLENO en la union de dos caras: une. Solo donde las dos
    // comparten el vertice; con el filtro de largo minimo puede haber
    // tramos que no se tocan, y ahi no hay nada que unir.
    tramos.forEach((g, i) => {
      const sig = tramos[(i + 1) % tramos.length]
      if (tramos.length < 2 || g[g.length - 1] !== sig[0]) return
      const v = pts[g[g.length - 1]]
      L.circleMarker(v, { radius: 6, color: '#0f6b47', weight: 2, fillColor: '#0f6b47', fillOpacity: 1 })
        .addTo(capaCaras)
        .on('click', (ev) => { L.DomEvent.stop(ev); unirCaras(m, i) })
        .on('contextmenu', (ev) => { L.DomEvent.stop(ev); volverAutomatico(m) })
        .bindTooltip('Unir estas dos caras')
    })

    // Punto HUECO en cada vertice interior: parte la cara ahi.
    tramos.forEach((g, i) => {
      for (let k = 1; k < g.length - 1; k++) {
        L.circleMarker(pts[g[k]], { radius: 5, color: '#0f6b47', weight: 2, fillColor: '#fff', fillOpacity: 1 })
          .addTo(capaCaras)
          .on('click', (ev) => { L.DomEvent.stop(ev); partirCara(m, i, k) })
          .on('contextmenu', (ev) => { L.DomEvent.stop(ev); volverAutomatico(m) })
          .bindTooltip('Partir la cara acá')
      }
    })
  }
}

// Las tres escriben SIEMPRE un array nuevo. El historial copia las
// manzanas en superficie, asi que mutar el array en su lugar dejaria a
// todas las fotos anteriores apuntando al mismo, y el Cmd+Z no volveria.
function guardarTramos (m, tramos, mensaje) {
  instantanea()
  m.caras = tramos
  m.carasN = anilloLatLng(m.geom).length
  refrescar()
  avisar(mensaje + ' <b>Cmd+Z</b> vuelve atrás.')
}

function unirCaras (m, i) {
  const tramos = tramosDe(m)
  if (tramos.length < 2) return avisar('Esa manzana tiene una sola cara.')
  const j = (i + 1) % tramos.length
  const unido = tramos[i].concat(tramos[j].slice(1))
  const nuevos = tramos
    .map((g, k) => (k === i ? unido : g))
    .filter((_, k) => k !== j)
  guardarTramos(m, nuevos, 'Caras unidas: la manzana <b>' + (m.letra || '').toUpperCase() +
    '</b> queda con <b>' + nuevos.length + '</b>.')
}

function partirCara (m, i, k) {
  const tramos = tramosDe(m)
  const g = tramos[i]
  const nuevos = tramos.flatMap((t, idx) => (idx === i ? [g.slice(0, k + 1), g.slice(k)] : [t]))
  guardarTramos(m, nuevos, 'Cara partida: la manzana <b>' + (m.letra || '').toUpperCase() +
    '</b> queda con <b>' + nuevos.length + '</b>.')
}

function volverAutomatico (m) {
  if (!m.caras) return avisar('Esa manzana ya está en automático.')
  instantanea()
  delete m.caras
  delete m.carasN
  refrescar()
  avisar('Manzana <b>' + (m.letra || '').toUpperCase() + '</b> vuelta al cálculo automático: <b>' +
    carasDeMz(m).length + '</b> caras.')
}

function resumenCaras () {
  const propias = [...manzanas.values()].filter((m) => m.territorio === activo && m.geom)
  if (!propias.length) return ''
  const hist = {}
  let total = 0
  let aMano = 0
  for (const m of propias) {
    const n = carasDeMz(m).length
    total += n
    hist[n] = (hist[n] || 0) + 1
    if (m.caras && m.carasN === anilloLatLng(m.geom).length) aMano++
  }
  return '<b>' + total + ' caras</b> en ' + propias.length + ' manzanas.<br>' +
    Object.entries(hist).sort((a, b) => a[0] - b[0])
      .map(([k, v]) => v + ' manzana' + (v === 1 ? '' : 's') + ' de ' + k).join(' · ') +
    (aMano ? '<br>' + aMano + ' corregida' + (aMano === 1 ? '' : 's') + ' a mano (en violeta).' : '') +
    '<br><small>Lo que no dé 4 conviene mirarlo.</small>'
}

/* ====================================================================
   GUARDAR EN LA BASE
   --------------------------------------------------------------------
   El editor vivia en el localStorage de un navegador. Ahora escribe
   contra la misma base que la app, con la sesion que el usuario ya
   inicio: se lee el token que supabase-js deja en este mismo origen.
   Del otro lado, la funcion comprueba que sea admin.
   ==================================================================== */

// La sesion de Supabase dura una hora y la RENUEVA la app, que es la que
// tiene el cliente. Esta pagina solo la lee. Si el token vencio y no lo
// miramos, cada guardado se va contra un 401 y el editor parece andar
// mientras no guarda nada. Por eso se comprueba el vencimiento ANTES de
// pedir, y se avisa con lo que hay que hacer.
function tokenDeSesion () {
  if (!BD_URL) return null
  if (sesionEmbebida?.accessToken) {
    if (sesionEmbebida.expiresAt && sesionEmbebida.expiresAt * 1000 < Date.now() + 60000) {
      sesionVencida = true
      return null
    }
    sesionVencida = false
    return sesionEmbebida.accessToken
  }
  const ref = BD_URL.replace(/^https?:\/\//, '').split('.')[0]
  try {
    const crudo = localStorage.getItem('sb-' + ref + '-auth-token')
    if (!crudo) return null
    const s = JSON.parse(crudo)
    // 60 segundos de margen: no sirve un token que vence en el camino.
    if (s?.expires_at && s.expires_at * 1000 < Date.now() + 60000) {
      sesionVencida = true
      return null
    }
    sesionVencida = false
    return s?.access_token ?? null
  } catch (e) { return null }
}

let publicacionEnVuelo = false
document.getElementById('bGuardarBD').onclick = async () => {
  if (publicacionEnVuelo) return
  if (!BD_URL || !BD_KEY) {
    await dialogo({ titulo: 'Sin conexión a la base',
      cuerpo: 'Esta página no tiene configurada la base. Abrila desde el mismo servidor que la app.' })
    return
  }
  const token = tokenDeSesion()
  if (!token) {
    await dialogo({
      titulo: sesionVencida ? 'Tu sesión venció' : 'Falta iniciar sesión',
      cuerpo: sesionVencida
        ? 'Abrí la app en otra pestaña de este navegador y volvé acá. La sesión se renueva sola y no perdés nada de lo que dibujaste.'
        : 'Entrá a la app en este mismo navegador, iniciá sesión como administrador y volvé.',
    })
    return
  }
  if (!activo) {
    await dialogo({ titulo: 'Elegí un territorio',
      cuerpo: 'Elegí el territorio que querés publicar junto con los afectados por tus movimientos.' })
    return
  }

  const t = territorios.get(activo)
  const mzDe = (id) => [...manzanas.values()]
    .filter((m) => m.territorio === id && m.geom)
    .sort((a, b) => (a.orden ?? 0) - (b.orden ?? 0))
  const propias = mzDe(activo)

  // Los que perdieron o ganaron una manzana en una mudanza y todavia no se
  // publicaron. Van en el mismo viaje: si se guarda uno solo, la manzana
  // queda en los dos territorios a la vez.
  const arrastrados = [...tocados]
    .filter((id) => id !== activo && territorios.has(id) && mzDe(id).length)
    .map((id) => territorios.get(id))
  // También publicar los orígenes vacíos, con confirmación explícita.
  const vaciados = [...tocados]
    .filter((id) => id !== activo && territorios.has(id) && !mzDe(id).length)
    .map((id) => territorios.get(id))

  const aPublicar = [t, ...arrastrados, ...vaciados]
  const vacios = aPublicar.filter((x) => !mzDe(x.id).length)
  publicacionEnVuelo = true
  const boton = document.getElementById('bGuardarBD')
  boton.disabled = true
  let enviada = false
  try {
  // Copia profunda antes de abrir el diálogo: nunca enviar ediciones posteriores
  // que la persona todavía no confirmó.
  const capturas = aPublicar.map((x) => ({
    id: x.id, nombre: String(x.numero),
    manzanas: JSON.parse(JSON.stringify(prepararTerritorio(x))),
  }))
  const versiones = await rpcEditor('revisar_publicacion_editor', {
    p_nombres: capturas.map((x) => x.nombre),
  }, token)
  const lote = capturas.map((x) => {
    const revision = versiones.find((v) => v.nombre.toLowerCase() === x.nombre.toLowerCase())
    if (!revision || !Number.isInteger(revision.version)) throw new Error('No se pudo verificar la versión del territorio ' + x.nombre)
    return { nombre: x.nombre, version_esperada: revision.version, manzanas: x.manzanas }
  })
  const caras = propias.reduce((n, m) => n + carasDeMz(m).length, 0)
  const ok = await dialogo({
    titulo: aPublicar.length > 1
      ? 'Guardar ' + aPublicar.length + ' territorios'
      : 'Guardar el territorio ' + t.numero,
    cuerpo: 'Los hermanos van a ver el territorio <b>' + t.numero + '</b> con las <b>' +
            propias.length + '</b> manzanas que dibujaste y sus <b>' + caras + ' cuadras</b>.<br><br>' +
            (arrastrados.length
              ? 'Moviste manzanas entre territorios, así que también se guarda ' +
                (arrastrados.length === 1 ? 'el territorio <b>' : 'los territorios <b>') +
                arrastrados.map((x) => x.numero).join('</b>, <b>') + '</b>. ' +
                'Guardar uno solo dejaría esa manzana en los dos a la vez.<br><br>'
              : '') +
            (vacios.length
              ? '<b>Ojo:</b> ' + (vacios.length === 1 ? 'el territorio ' : 'los territorios ') +
                vacios.map((x) => x.numero).join(', ') +
                ' quedarán sin manzanas vigentes. Al confirmar retirás todo su dibujo actual, conservando el historial.<br><br>'
              : '') +
            'Se guarda el lote completo o ninguno. Si otro admin publica mientras confirmás, se rechaza el lote. El trabajo informado queda en el historial.',
    aceptar: aPublicar.length > 1 ? 'Guardar los ' + aPublicar.length : 'Guardar',
  })
  if (!ok) return

  avisar('Guardando…')
    enviada = true
    const resultados = await rpcEditor('publicar_territorios_atomico', { p_territorios: lote }, token)
    if (!Array.isArray(resultados) || resultados.length !== capturas.length) throw new Error('Respuesta de publicación incompleta')
    const hechos = resultados.map((res, i) => ({ numero: capturas[i].nombre, ...res }))
    for (const captura of capturas) {
      const actual = territorios.get(captura.id)
      if (actual && String(actual.numero) === captura.nombre &&
          JSON.stringify(prepararTerritorio(actual)) === JSON.stringify(captura.manzanas)) tocados.delete(captura.id)
    }
    guardar()
    avisar(hechos.map((h) =>
      'Territorio <b>' + h.numero + '</b> guardado: ' + h.manzanas + ' manzanas, ' +
      h.lados + ' cuadras.' +
      (h.manzanas_retiradas
        ? ' Se retiraron ' + h.manzanas_retiradas + ' manzanas del dibujo anterior.' : '') +
      (h.lados_con_cobertura_retirados
        ? '<br><b>Ojo:</b> ' + h.lados_con_cobertura_retirados +
          ' cuadras con trabajo informado quedaron en el dibujo viejo.' : '')
    ).join('<br>'))
    void traerDeLaBase()
  } catch (e) {
    avisar('No se pudo confirmar el guardado: ' + e.message)
    await dialogo({
      titulo: 'Revisá la publicación',
      cuerpo: String(e.message) +
        (enviada ? '<br><br>Si se cortó la conexión, el lote podría haberse guardado completo. Revisá la base antes de volver a publicar. No se reintenta automáticamente.' : '<br><br>No se envió ninguna publicación.'),
    })
    void traerDeLaBase()
  } finally {
    publicacionEnVuelo = false
    boton.disabled = false
  }
}

// Publica el dibujo de UN territorio. La RPC reemplaza el dibujo entero: lo
// que no venga en esta lista se retira.
function prepararTerritorio (t) {
  const propias = [...manzanas.values()]
    .filter((m) => m.territorio === t.id && m.geom)
    .sort((a, b) => (a.orden ?? 0) - (b.orden ?? 0))

  const cuerpo = propias.map((m, orden) => {
    const centro = centroDe(m.geom)
    return {
      label: m.letra, orden, lat: centro[0], lng: centro[1],
      geom: m.geom, area_m2: areaM2De(m.geom),
      lados: carasDeMz(m).map((c, i) => ({
        orden: i,
        geom: { type: 'LineString', coordinates: c.puntos.map(([la, ln]) => [ln, la]) },
        largo_m: c.largo_m,
        rumbo_grados: c.rumbo_grados,
        medio_lat: Number(c.medio[0].toFixed(6)),
        medio_lng: Number(c.medio[1].toFixed(6)),
      })),
    }
  })

  return cuerpo
}

async function rpcEditor (nombre, cuerpo, token) {
  const r = await fetch(BD_URL + '/rest/v1/rpc/' + nombre, {
    method: 'POST',
    headers: { apikey: BD_KEY, Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' },
    body: JSON.stringify(cuerpo),
  })
  const txt = await r.text()
  if (!r.ok) {
    let msg = txt
    try { msg = JSON.parse(txt).message || txt } catch (e) { /* no era json */ }
    throw new Error(msg)
  }
  return JSON.parse(txt)
}

/* ====================================================================
   PONER LAS LETRAS A MANO
   --------------------------------------------------------------------
   Habia dos ordenes automaticos: el de marcado y el geografico. Ninguno
   sirve cuando el recorrido real de la manzana lo decide otra cosa: por
   donde se entra, donde para el colectivo, que vereda conviene primero.

   No hace falta un campo nuevo. La letra ya sale de `orden`, asi que
   poner letras a mano es RE-SELLAR ese orden con el que la persona toca
   las manzanas. Guardar, deshacer y exportar siguen funcionando igual.

   Durante el paso NO se toca `m.letra`: las letras provisorias se
   dibujan en su propia capa. Si se toca el dato antes de la foto del
   historial, Cmd+Z devuelve al lio a medio hacer en vez de al principio.
   ==================================================================== */

function pintarLetrasNuevas () {
  pintarBarraMovil()
  capaLetrasNuevas.clearLayers()
  if (herramienta !== 'letras') return
  letrasNuevas.forEach((id, i) => {
    const m = manzanas.get(id)
    if (!m) return
    const c = puntoDeRotulo(m.geom)
    L.marker([c[1], c[0]], {
      interactive: false,
      icon: L.divIcon({
        className: '',
        html: '<span style="background:#7c3aed;color:#fff;border-radius:50%;width:22px;height:22px;' +
              'display:grid;place-items:center;font:700 12px/1 system-ui;box-shadow:0 1px 4px rgba(0,0,0,.35)">' +
              (LETRAS[i] || '·') + '</span>',
        iconSize: [22, 22],
        iconAnchor: [11, 11],
      }),
    }).addTo(capaLetrasNuevas)
  })

  const total = [...manzanas.values()].filter(m => m.territorio === activo).length
  const n = letrasNuevas.length
  if (!n) {
    avisar('Tocá las manzanas en el <b>orden</b> que querés: la primera va a ser la <b>A</b>. ' +
      'Tocar una ya elegida la saca junto con las que vinieron después.')
  } else if (n >= total) {
    aplicarLetrasNuevas()
  } else {
    avisar(`Vas <b>${n}</b> de ${total}. La próxima va a ser la <b>${LETRAS[n]}</b>. ` +
      (enTelefono() ? 'Tocá <b>Listo</b> abajo para aplicar.' : '<b>Enter</b> aplica lo que llevás, <b>Esc</b> cancela.'))
  }
}

function aplicarLetrasNuevas () {
  if (!letrasNuevas.length || !activo) return
  const elegidas = letrasNuevas
  // Recien aca se toca el dato: la accion ya no puede fallar.
  instantanea()
  elegidas.forEach((id, i) => {
    const m = manzanas.get(id)
    if (m) m.orden = i
  })
  // Las que no se tocaron van despues, respetando el orden que traian.
  const resto = [...manzanas.values()]
    .filter(m => m.territorio === activo && !elegidas.includes(m.id))
    .sort((a, b) => (a.orden ?? 0) - (b.orden ?? 0))
  resto.forEach((m, k) => { m.orden = elegidas.length + k })

  const t = territorios.get(activo)
  if (t) t.letras = 'orden'
  // El contador global tiene que quedar por encima de lo que acabamos de
  // sellar, o la proxima manzana que se sume aterriza en el medio.
  ordenSiguiente = Math.max(ordenSiguiente, elegidas.length + resto.length)

  letrasNuevas = []
  capaLetrasNuevas.clearLayers()
  reletrar(activo)
  refrescar()
  avisar(`Letras puestas a mano: <b>${elegidas.length}</b> manzana${elegidas.length === 1 ? '' : 's'} en el orden que marcaste` +
    (resto.length ? `, y ${resto.length} atrás.` : '.') + ' <b>Cmd+Z</b> vuelve atrás.')
}

function cancelarLetras () {
  if (!letrasNuevas.length) return false
  letrasNuevas = []
  capaLetrasNuevas.clearLayers()
  avisar('Se dejaron las letras como estaban.')
  return true
}

/* Que dice la base hoy. Se guarda de a un territorio por vez y son 69:
   sin esto no hay forma de saber cual ya se subio, cual quedo a medias y
   cual todavia no existe alla. La vista cobertura_territorio ya trae la
   cuenta de manzanas vigentes por territorio, asi que es una consulta. */
async function traerDeLaBase (avisando = false) {
  const token = tokenDeSesion()
  if (!BD_URL || !BD_KEY || !token) {
    if (avisando) avisar('Para ver qué falta guardar, entrá a la app en este navegador y volvé.')
    return
  }
  try {
    const r = await fetch(`${BD_URL}/rest/v1/cobertura_territorio?select=name,manzanas`, {
      headers: { apikey: BD_KEY, Authorization: 'Bearer ' + token },
    })
    if (!r.ok) throw new Error(await r.text())
    const filas = await r.json()
    enLaBase = new Map(filas.map((f) => [String(f.name), Number(f.manzanas) || 0]))
    refrescarPanel()
    if (avisando) {
      let iguales = 0, distintos = 0, sinCargar = 0
      for (const t of territorios.values()) {
        const n = [...manzanas.values()].filter((m) => m.territorio === t.id).length
        if (!n) continue
        const b = enLaBase.get(String(t.numero))
        if (!b) sinCargar++
        else if (b !== n) distintos++
        else iguales++
      }
      avisar(`<b>${iguales}</b> territorio${iguales === 1 ? '' : 's'} ya guardado${iguales === 1 ? '' : 's'}, ` +
        `<b>${distintos}</b> con cambios sin guardar y <b>${sinCargar}</b> sin guardar nunca.`)
    }
  } catch (e) {
    if (avisando) avisar('No se pudo leer la base: ' + String(e.message).slice(0, 120))
  }
}

/* ====================================================================
   EL BORRADOR VIVE EN LA BASE
   --------------------------------------------------------------------
   Todo esto vivia en el localStorage de un navegador: 69 territorios,
   652 asignaciones, las geometrias editadas a mano y las caras
   corregidas. Borrar los datos del navegador se lo llevaba puesto, y
   ya habia 25 territorios de trabajo que no existian en ningun otro
   lado.

   Ahora manda la base. El navegador queda de red de contencion para
   cuando no hay internet, no como la unica copia.

   Cuidado con dos cosas:

   - Las escrituras se agrupan. Dibujar mueve el estado muchas veces por
     segundo y una consulta por movimiento traba el editor.
   - Se escribe solo si la fila sigue como la leimos. Si otro admin
     guardo mientras tanto, no se pisa: se avisa. Es un borrador
     compartido y el ultimo en apretar no tiene por que tener razon.
   ==================================================================== */

function cabecerasBase (token, extra = {}) {
  return { apikey: BD_KEY, Authorization: 'Bearer ' + token, 'Content-Type': 'application/json', ...extra }
}

function pintarEstadoBorrador () {
  const txt = document.getElementById('estadoArchivo')
  const barra = document.getElementById('barraArchivo')
  if (!txt) return
  const hora = borradorHora
    ? borradorHora.toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' })
    : null
  const mapa = {
    sin_sesion: [sesionVencida
      ? 'Tu sesión venció y no se está guardando. Abrí la app en otra pestaña y volvé acá: se renueva sola.'
      : 'Sin sesión: tu trabajo no se está guardando. Entrá a la app y volvé.', true],
    guardando: ['Guardando…', false],
    guardado: [hora ? `Tu trabajo está guardado · ${hora}` : 'Tu trabajo está guardado', false],
    local: ['No se pudo guardar. Por ahora solo queda en esta computadora.', true],
    vacio: ['Todavía no se guardó nada. Se guarda solo con tu primer cambio.', false],
    conflicto: ['Otra persona guardó después que vos. Recargá antes de seguir.', true],
  }
  const [texto, alarma] = mapa[borradorEstado] || mapa.local
  txt.innerHTML = texto + (manejadorArchivo ? ` · copia en <b>${manejadorArchivo.name}</b>` : '')
  barra.style.background = alarma ? 'var(--malo-bg, #fdecea)' : 'var(--bien-bg, #e8f5ee)'
  barra.style.color = alarma ? '#8a2b1c' : '#0f6b47'
}

async function leerBorrador () {
  const token = tokenDeSesion()
  if (!BD_URL || !BD_KEY || !token) { borradorEstado = 'sin_sesion'; pintarEstadoBorrador(); return null }
  try {
    const r = await fetch(
      `${BD_URL}/rest/v1/editor_estado?id=eq.${BORRADOR_ID}&select=estado,actualizado_at`,
      { headers: cabecerasBase(token) },
    )
    if (!r.ok) throw new Error(await r.text())
    const filas = await r.json()
    baseLeida = true
    if (!filas.length) {
      // La tabla existe y contesta, pero todavia nadie guardo nada.
      borradorEstado = 'vacio'
      pintarEstadoBorrador()
      return null
    }
    borradorSello = filas[0].actualizado_at
    borradorHora = new Date(filas[0].actualizado_at)
    borradorEstado = 'guardado'
    pintarEstadoBorrador()
    return filas[0].estado
  } catch (e) {
    borradorEstado = 'local'
    pintarEstadoBorrador()
    return null
  }
}

function guardarBorrador (datos) {
  borradorPendiente = datos
  clearTimeout(borradorTimer)
  borradorTimer = setTimeout(() => void escribirBorrador(), 1200)
}

async function escribirBorrador () {
  if (borradorEnVuelo) return
  const datos = borradorPendiente
  if (!datos) return
  const token = tokenDeSesion()
  if (!BD_URL || !BD_KEY || !token) { borradorEstado = 'sin_sesion'; pintarEstadoBorrador(); return }
  if (borradorEstado === 'conflicto') return
  // Si al abrir no pudimos LEER la base, no escribimos. Si no, un corte de
  // red al arrancar termina subiendo lo que haya en memoria -incluso la
  // semilla del archivo estatico- encima del trabajo bueno que si esta
  // guardado alla.
  if (!baseLeida) { borradorEstado = 'local'; pintarEstadoBorrador(); return }

  borradorEnVuelo = true
  borradorEstado = 'guardando'
  pintarEstadoBorrador()
  const ahora = new Date().toISOString()
  const cuerpo = { id: BORRADOR_ID, estado: datos, actualizado_at: ahora }
  try {
    let r
    if (borradorSello) {
      // Solo si nadie escribio despues de lo que leimos.
      r = await fetch(
        `${BD_URL}/rest/v1/editor_estado?id=eq.${BORRADOR_ID}&actualizado_at=eq.${encodeURIComponent(borradorSello)}`,
        { method: 'PATCH', headers: cabecerasBase(token, { Prefer: 'return=representation' }), body: JSON.stringify(cuerpo) },
      )
      if (r.ok && !(await r.clone().json()).length) {
        borradorEstado = 'conflicto'
        pintarEstadoBorrador()
        avisar('<b>Alguien más guardó el editor después que vos.</b> Recargá la página antes de seguir, o vas a pisarle el trabajo.')
        return
      }
    } else {
      r = await fetch(`${BD_URL}/rest/v1/editor_estado`, {
        method: 'POST',
        // Dos pestañas pueden haber leído una tabla vacía. INSERT estricto:
        // la segunda debe entrar en conflicto, nunca hacer upsert encima.
        headers: cabecerasBase(token, { Prefer: 'return=representation' }),
        body: JSON.stringify(cuerpo),
      })
    }
    if (r.status === 409) {
      borradorEstado = 'conflicto'
      avisar('Otra pestaña creó el borrador. Tu copia local se conserva; recargá antes de reemplazar el trabajo compartido.')
      return
    }
    if (!r.ok) throw new Error(await r.text())
    const filasGuardadas = await r.json()
    if (!filasGuardadas[0]?.actualizado_at) throw new Error('La base no confirmó la versión del borrador')
    borradorSello = filasGuardadas[0].actualizado_at
    borradorHora = new Date(borradorSello)
    if (borradorPendiente === datos) borradorPendiente = null
    borradorEstado = 'guardado'
  } catch (e) {
    borradorEstado = 'local'
  } finally {
    borradorEnVuelo = false
    pintarEstadoBorrador()
    if (borradorEstado === 'guardado' && borradorPendiente) {
      clearTimeout(borradorTimer)
      borradorTimer = setTimeout(() => void escribirBorrador(), 0)
    }
  }
}

/* Traer de la base el dibujo publicado de un territorio.
   --------------------------------------------------------------------
   El editor escribia y nunca leia de vuelta. Mientras el borrador y lo
   publicado dijeran lo mismo no se notaba; el dia que se separaron -y
   se separaron- el editor siguio mostrando su version vieja para
   siempre, sin forma de recuperar lo que ya estaba guardado bien.

   Las manzanas que vuelven traen su forma y su letra de la base. No
   conservan el id de OpenStreetMap del que salieron, asi que las
   originales pueden reaparecer libres abajo: son candidatas, no
   duplicados, y se ven distinto porque no tienen territorio. */
document.getElementById('bTraerTerr').onclick = async () => {
  if (!activo) return
  // Se anota a cual se le pidio ANTES de preguntar. Entre la pregunta y el
  // si hay dos esperas -la consulta a la base y el dialogo-, y en ese rato se
  // puede cambiar de territorio en el panel. Leyendo `activo` despues, las
  // manzanas de uno terminaban metidas en el otro: el que las recibia se
  // quedaba con las suyas y las ajenas, y el otro sin ninguna.
  const destino = activo
  const t = territorios.get(destino)
  const token = tokenDeSesion()
  if (!BD_URL || !BD_KEY || !token) {
    await dialogo({
      titulo: sesionVencida ? 'Tu sesión venció' : 'Falta iniciar sesión',
      cuerpo: 'Abrí la app en otra pestaña de este navegador y volvé acá.',
    })
    return
  }

  let filas
  try {
    const H = { apikey: BD_KEY, Authorization: 'Bearer ' + token }
    const rt = await fetch(`${BD_URL}/rest/v1/territorios?select=id&name=eq.${encodeURIComponent(t.numero)}`, { headers: H })
    const terr = await rt.json()
    if (!terr.length) throw new Error('En la base no existe el territorio ' + t.numero)
    const rm = await fetch(
      `${BD_URL}/rest/v1/territorio_manzanas?select=id,label,orden,geometry_geojson&vigente_hasta=is.null&territory_id=eq.${terr[0].id}&order=orden`,
      { headers: H },
    )
    filas = (await rm.json()).filter((f) => f.geometry_geojson)
    if (!filas.length) throw new Error('El territorio ' + t.numero + ' no tiene manzanas guardadas en la base.')
  } catch (e) {
    await dialogo({ titulo: 'No se pudo traer', cuerpo: String(e.message).slice(0, 200) })
    return
  }

  const actuales = [...manzanas.values()].filter((m) => m.territorio === destino)
  const ok = await dialogo({
    titulo: 'Traer el territorio ' + t.numero + ' de la base',
    cuerpo:
      `Acá tenés <b>${actuales.length}</b> manzana${actuales.length === 1 ? '' : 's'} en este territorio ` +
      `y en la base hay <b>${filas.length}</b>.<br><br>` +
      'Se reemplaza lo de acá por lo guardado. Las manzanas sueltas del mapa no se tocan.',
    aceptar: 'Traer',
    peligro: actuales.length > filas.length,
  })
  if (!ok) return

  instantanea()
  for (const m of actuales) manzanas.delete(m.id)
  filas.forEach((f, i) => {
    const id = 'bd:' + f.id
    manzanas.set(id, {
      id,
      geom: f.geometry_geojson,
      territorio: destino,
      orden: f.orden ?? i,
      editada: true,
    })
    ordenSiguiente = Math.max(ordenSiguiente, (f.orden ?? i) + 1)
  })
  t.letras = 'orden'
  // Queda igual a lo publicado, asi que no le falta ninguna mudanza.
  tocados.delete(destino)
  reletrar(destino)
  enfocar(destino)
  refrescar()
  avisar(`Territorio <b>${t.numero}</b> traído de la base: <b>${filas.length}</b> manzanas con sus letras. <b>Cmd+Z</b> vuelve atrás.`)
}

/* ====================================================================
   LOS BOTONES DEL TELEFONO
   --------------------------------------------------------------------
   En la compu, un gesto a medias se cierra con Enter y se descarta con
   Esc, y Cmd+Z deshace. En un telefono no hay teclas: sin estos botones
   quedas a medio dibujar una manzana sin forma de cerrarla.

   La barra cambia sola: mientras no hay nada empezado muestra el panel
   y deshacer; apenas hay un gesto en curso muestra cancelar y listo.
   ==================================================================== */

const enTelefono = () => window.matchMedia('(max-width: 960px)').matches

function gestoEnCurso () {
  if (dibujo.length) return { que: 'dibujo', n: dibujo.length }
  if (letrasNuevas.length) return { que: 'letras', n: letrasNuevas.length }
  if (paraFusionar.length) return { que: 'fusion', n: paraFusionar.length }
  if (cortePuntos.length) return { que: 'corte', n: cortePuntos.length }
  if (edicion) return { que: 'vertices', n: 0 }
  return null
}

function pintarBarraMovil () {
  const app = document.querySelector('.app')
  const listoEl = document.getElementById('mListo')
  if (!app || !listoEl) return
  const g = gestoEnCurso()
  app.classList.toggle('hay-gesto', Boolean(g))
  const listo = listoEl
  const deshacer = document.getElementById('mDeshacer')
  deshacer.disabled = !historial.length
  if (!g) return
  listo.disabled = false
  listo.innerHTML =
    g.que === 'dibujo' ? `${icono('completo')} Cerrar la manzana (${g.n})`
    : g.que === 'letras' ? `${icono('completo')} Aplicar las letras (${g.n})`
    : g.que === 'vertices' ? `${icono('completo')} Terminar de mover`
    : g.que === 'fusion' ? `${icono('fusionar')} Elegí la segunda`
    : `${icono('marcar')} Marcá el segundo punto`
  listo.disabled = g.que === 'fusion' || g.que === 'corte'
}

document.getElementById('mPanel').onclick = () =>
  document.querySelector('.app').classList.toggle('panel-abierto')

document.getElementById('mDeshacer').onclick = () => { deshacer(); pintarBarraMovil() }

document.getElementById('mCancelar').onclick = () => {
  // Mismo orden que Esc: se suelta el gesto mas chico primero.
  if (dibujo.length) { cancelarDibujo(); avisar('Dibujo descartado.') }
  else if (letrasNuevas.length) cancelarLetras()
  else if (edicion) terminarEdicion()
  else if (paraFusionar.length) { paraFusionar = []; refrescarMapa() }
  else if (cortePuntos.length) { cortePuntos = []; capaCorte.clearLayers() }
  pintarBarraMovil()
}

document.getElementById('mListo').onclick = () => {
  if (dibujo.length) cerrarDibujo()
  else if (letrasNuevas.length) aplicarLetrasNuevas()
  else if (edicion) terminarEdicion()
  pintarBarraMovil()
}

// La barra se entera de todo lo que pasa sin tener que llamarla desde
// cada funcion: cualquier toque en el mapa o en el panel la repinta.
pintarBarraMovil()

// Al elegir un territorio desde el panel, en telefono el panel se cierra
// solo: si no, tapa el mapa justo cuando queres verlo.
document.getElementById('listaT').addEventListener('click', () => {
  if (window.matchMedia('(max-width: 960px)').matches) {
    document.querySelector('.app').classList.remove('panel-abierto')
  }
}, true)

/* ====================================================================
   DONDE ESTOY, Y QUE LA PANTALLA NO SE APAGUE
   --------------------------------------------------------------------
   Esto es lo que separa una pagina que entra en un telefono de una app
   que sirve en la calle.

   Armar territorios sentado mira OpenStreetMap y adivina. Armarlos
   caminando mira la manzana. Para eso hace falta una sola cosa: saber
   donde estas parado, y que la manzana de adelante sea la que tocas.

   Y que la pantalla no se apague cada treinta segundos mientras
   caminas, que es lo que la vuelve inusable de verdad.
   ==================================================================== */

let vigilanciaGPS = null
let capaYo = null
let siguiendo = false
let pantallaDespierta = null

async function mantenerPantalla (encender) {
  try {
    if (encender && !pantallaDespierta && 'wakeLock' in navigator) {
      pantallaDespierta = await navigator.wakeLock.request('screen')
      // El sistema la suelta solo al cambiar de app; se vuelve a pedir.
      pantallaDespierta.addEventListener('release', () => { pantallaDespierta = null })
    } else if (!encender && pantallaDespierta) {
      await pantallaDespierta.release()
      pantallaDespierta = null
    }
  } catch (e) { /* el navegador no la soporta: no es motivo para frenar nada */ }
}

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && siguiendo) void mantenerPantalla(true)
})

function pintarYo (pos) {
  const p = [pos.coords.latitude, pos.coords.longitude]
  if (!capaYo) {
    capaYo = L.layerGroup().addTo(mapa)
  }
  capaYo.clearLayers()
  // El circulo es la precision real, no un adorno: con 40 metros de error
  // no conviene decidir a que manzana pertenece lo que ves.
  L.circle(p, { radius: pos.coords.accuracy, color: '#407dfe', weight: 1, fillOpacity: 0.08, interactive: false }).addTo(capaYo)
  L.circleMarker(p, { radius: 7, color: '#fff', weight: 3, fillColor: '#407dfe', fillOpacity: 1, interactive: false }).addTo(capaYo)
  return p
}

function ubicarme () {
  const boton = document.getElementById('mUbicar')
  if (siguiendo) {
    navigator.geolocation.clearWatch(vigilanciaGPS)
    vigilanciaGPS = null
    siguiendo = false
    boton.classList.remove('on')
    if (capaYo) { capaYo.clearLayers() }
    void mantenerPantalla(false)
    avisar('Dejé de seguir tu posición.')
    return
  }
  if (!navigator.geolocation) return avisar('Este navegador no puede darme tu posición.')

  siguiendo = true
  boton.classList.add('on')
  avisar('Buscando dónde estás…')
  void mantenerPantalla(true)

  let primera = true
  vigilanciaGPS = navigator.geolocation.watchPosition(
    (pos) => {
      const p = pintarYo(pos)
      if (primera) {
        primera = false
        mapa.setView(p, Math.max(mapa.getZoom(), 17))
        avisar(`Estás acá, con <b>${Math.round(pos.coords.accuracy)} m</b> de precisión. ` +
          'Tocá la manzana que tenés adelante.')
      }
    },
    (err) => {
      siguiendo = false
      boton.classList.remove('on')
      void mantenerPantalla(false)
      avisar(err.code === 1
        ? 'No me diste permiso para ver tu ubicación. Se habilita desde los ajustes del navegador.'
        : 'No pude encontrar tu posición. Probá al aire libre.')
    },
    { enableHighAccuracy: true, maximumAge: 5000, timeout: 20000 },
  )
}

document.getElementById('mUbicar').onclick = ubicarme
</script>
