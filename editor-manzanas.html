  'natural=sand': 'arenal',
}
const nombreSuelo = (q) => NOMBRE_SUELO[q] || q

const RADIO = 6378137
const arad = (d) => d * Math.PI / 180

function perimetro (anillo) {
  let p = 0
  for (let i = 0; i < anillo.length - 1; i++) {
    const a = anillo[i], b = anillo[i + 1]
    const dx = arad(b[0] - a[0]) * Math.cos(arad((a[1] + b[1]) / 2)) * RADIO
    const dy = arad(b[1] - a[1]) * RADIO
    p += Math.hypot(dx, dy)
  }
  return p
}

function diagnosticar (m) {
  // Dada por buena a mano: no vuelve a aparecer en ningun lado.
  if (revisadas.has(m.id)) return null
  if (m.__diag !== undefined) return m.__diag
  const anillo = m.geom.coordinates[0]
  const a = area(feat(m.geom))
  const v = anillo.length - 1
  const p = perimetro(anillo)
  // Compacidad de Polsby-Popper: 1 es un circulo, una manzana normal ronda 0,7.
  const comp = p ? (4 * Math.PI * a) / (p * p) : 0

  let d = null
  const sv = SIN_VIVIENDAS.get(m.id)
  // Va primero: que una plaza sea grande o rara es lo de menos, el punto es
  // que ahi no hay a quien visitar.
  if (sv && !m.editada) {
    d = { tipo: 'sinviviendas', txt: `${nombreSuelo(sv.q)} \u00b7 ${Math.round(sv.f * 100)}% sin viviendas` }
  }
  else if (a > 40000) d = { tipo: 'gigante', txt: `${(a / 10000).toFixed(1)} ha · cubre varias manzanas` }
  else if (comp < 0.25 && a > 3000) d = { tipo: 'rara', txt: `forma irregular · compacidad ${comp.toFixed(2)}` }
  else if (v > 40) d = { tipo: 'detalle', txt: `${v} vértices · demasiado detalle` }

  m.__diag = d
  return d
}

const limpiarDiag = (m) => { delete m.__diag }

// ------------------------------------------------------- editar vertices
// Editor propio, sin leaflet-draw: tiradores arrastrables sobre cada vertice,
// puntos intermedios para agregar, y clic derecho para quitar.
function terminarEdicion () {
  if (!edicion) return
  capaEdicion.clearLayers()
  edicion = null
  refrescar()
}

function anilloDe (m) {
  const a = m.geom.coordinates[0]
  // GeoJSON cierra el anillo repitiendo el primer punto; se trabaja sin el.
  return a.length > 1 && a[0][0] === a[a.length - 1][0] && a[0][1] === a[a.length - 1][1]
    ? a.slice(0, -1) : a.slice()
}

function guardarAnillo (m, pts) {
  if (pts.length < 3) return false
  m.geom = { type: 'Polygon', coordinates: [[...pts, pts[0]]] }
  m.editada = true
  limpiarDiag(m)
  return true
}

function iniciarEdicion (idManzana) {
  terminarEdicion()
  const m = manzanas.get(idManzana)
  if (!m) return
  let pts = anilloDe(m)

  const contorno = L.polygon(pts.map(([x, y]) => [y, x]),
    { color: '#5554F2', weight: 2.5, fillColor: '#5554F2', fillOpacity: .18, interactive: false })
  capaEdicion.addLayer(contorno)

  const repintar = () => {
    contorno.setLatLngs(pts.map(([x, y]) => [y, x]))
    dibujarTiradores()
  }

  function dibujarTiradores () {
    capaEdicion.eachLayer(l => { if (l !== contorno) capaEdicion.removeLayer(l) })

    pts.forEach((p, i) => {
      const mk = L.marker([p[1], p[0]], { draggable: true, zIndexOffset: 1000,
        icon: L.divIcon({ className: 'vert', iconSize: [13, 13], iconAnchor: [6.5, 6.5] }) })
      mk.on('drag', (ev) => { const ll = ev.target.getLatLng(); pts[i] = [ll.lng, ll.lat]; contorno.setLatLngs(pts.map(([x, y]) => [y, x])) })
      mk.on('dragend', () => { instantanea(); guardarAnillo(m, pts); guardar(); repintar() })
      mk.on('contextmenu', (ev) => {
        L.DomEvent.stop(ev)
        if (pts.length <= 3) return avisar('Una manzana necesita al menos 3 vértices.')
        instantanea(); pts.splice(i, 1); guardarAnillo(m, pts); guardar(); repintar()
      })
      capaEdicion.addLayer(mk)
    })

    // puntos intermedios: agregan un vertice donde se los toca
    pts.forEach((p, i) => {
      const q = pts[(i + 1) % pts.length]
      const medio = [(p[0] + q[0]) / 2, (p[1] + q[1]) / 2]
      const mk = L.marker([medio[1], medio[0]], { zIndexOffset: 900,
        icon: L.divIcon({ className: 'vert-medio', iconSize: [9, 9], iconAnchor: [4.5, 4.5] }) })
      mk.on('click', (ev) => {
        L.DomEvent.stop(ev)
        instantanea(); pts.splice(i + 1, 0, medio); guardarAnillo(m, pts); guardar(); repintar()
      })
      capaEdicion.addLayer(mk)
    })
  }

  edicion = { id: idManzana }
  dibujarTiradores()
  avisar(`Editando una manzana de <b>${Math.round(area(feat(m.geom)))} m²</b>. Arrastrá los puntos, tocá los claros para agregar, clic derecho para quitar. <b>Esc</b> termina.`)
}

// ------------------------------------------------------- dibujar manzana
// Para las zonas donde OpenStreetMap no tiene las calles y no hay manzana.
function cancelarDibujo () {
  dibujo = []
  capaDibujo.clearLayers()
}

// El iman trabaja en pixeles, no en grados: a 12 px de distancia se siente
// igual en cualquier zoom, y comparar grados cerca del ecuador o lejos no.
// Los vecinos se pasan a pixeles una sola vez y no en cada movimiento del mouse.
const RADIO_ANCLA = 13
const RADIO_LADO = 9
const RADIO_CIERRE = 14

function prepararIman () {
  anclas = []; lados = []
  if (herramienta !== 'dibujar') return
  const lim = mapa.getBounds().pad(0.1)
  for (const m of manzanas.values()) {
    const anillo = m.geom.coordinates[0]
    if (!dentro(anillo, lim)) continue
    const pts = anillo.map(([x, y]) => mapa.latLngToLayerPoint(L.latLng(y, x)))
    for (let i = 0; i < anillo.length - 1; i++) {
      anclas.push({ p: pts[i], ll: anillo[i] })
      lados.push({ a: pts[i], b: pts[i + 1] })
    }
  }
}

function aLatLng (p) { const l = mapa.layerPointToLatLng(p); return [l.lng, l.lat] }

// Devuelve donde cae realmente el punto y por que: vertice, lado o libre.
function ajustar (latlng) {
  const p = mapa.latLngToLayerPoint(latlng)
  if (!iman) return { pt: [latlng.lng, latlng.lat], tipo: 'libre' }

  let mejor = null, dist = RADIO_ANCLA
  for (const a of anclas) {
    const d = p.distanceTo(a.p)
    if (d < dist) { dist = d; mejor = a }
  }
  if (mejor) return { pt: [...mejor.ll], tipo: 'vertice' }

  let mejorL = null, distL = RADIO_LADO
  for (const l of lados) {
    const vx = l.b.x - l.a.x, vy = l.b.y - l.a.y
    const largo = vx * vx + vy * vy
    if (!largo) continue
    let t = ((p.x - l.a.x) * vx + (p.y - l.a.y) * vy) / largo
    t = Math.max(0, Math.min(1, t))
    const q = L.point(l.a.x + t * vx, l.a.y + t * vy)
    const d = p.distanceTo(q)
    if (d < distL) { distL = d; mejorL = q }
  }
  if (mejorL) return { pt: aLatLng(mejorL), tipo: 'lado' }

  return { pt: [latlng.lng, latlng.lat], tipo: 'libre' }
}

// Si el cursor esta encima del primer punto, el proximo clic cierra la figura.
function cierraAca (latlng) {
  if (dibujo.length < 3) return false
  const p = mapa.latLngToLayerPoint(latlng)
  const q = mapa.latLngToLayerPoint(L.latLng(dibujo[0][1], dibujo[0][0]))
  return p.distanceTo(q) < RADIO_CIERRE
}

function pintarDibujo (previo = null, tipoPrevio = 'libre', cerrando = false) {
  capaDibujo.clearLayers()
  if (!dibujo.length) return

  const linea = dibujo.map(([x, y]) => [y, x])
  if (previo && !cerrando) linea.push([previo[1], previo[0]])
  if (linea.length > 1) {
    capaDibujo.addLayer(L.polyline(linea, { color: '#FA5D27', weight: 2.5, dashArray: '5,4', interactive: false }))
  }
  // Con 3 puntos ya se ve el relleno que va a quedar.
  if (dibujo.length >= 2 && (previo || cerrando)) {
    const cara = cerrando ? dibujo : [...dibujo, previo]
    if (cara.length >= 3) {
      capaDibujo.addLayer(L.polygon(cara.map(([x, y]) => [y, x]),
        { color: '#FA5D27', weight: 0, fillColor: '#FA5D27', fillOpacity: .18, interactive: false }))
    }
  }

  dibujo.forEach(([x, y], i) => capaDibujo.addLayer(
    L.circleMarker([y, x], {
      radius: i === 0 && cerrando ? 8 : 4.5,
      color: '#FA5D27', weight: i === 0 && cerrando ? 3 : 2,
      fillColor: i === 0 && cerrando ? '#FA5D27' : '#fff',
      fillOpacity: 1, interactive: false,
    })))

  // El punto fantasma dice de antemano donde va a caer y si se pego a algo.
  if (previo && !cerrando) {
    const pegado = tipoPrevio !== 'libre'
    capaDibujo.addLayer(L.circleMarker([previo[1], previo[0]], {
      radius: pegado ? 6.5 : 4,
      color: pegado ? '#01BC73' : '#888a8b',
      weight: pegado ? 3 : 1.5,
      fillColor: '#fff', fillOpacity: 1, interactive: false,
    }))
  }
}

function cerrarDibujo () {
  if (dibujo.length < 3) return avisar('Necesitás al menos <b>3 puntos</b> para cerrar una manzana.')
  instantanea()
  const id = 'm' + Date.now().toString(36)
  manzanas.set(id, {
    id, geom: { type: 'Polygon', coordinates: [[...dibujo, dibujo[0]]] },
    territorio: activo || null, editada: true,
  })
  if (activo) { sellarOrden(manzanas.get(id)); reletrar(activo) }
  const m2 = Math.round(area(feat(manzanas.get(id).geom)))
  cancelarDibujo()
  refrescar()
  prepararIman()
  avisar(`Manzana nueva de <b>${m2} m²</b>` + (activo
    ? ` sumada al territorio <b>${territorios.get(activo).numero}</b>. Seguí dibujando la siguiente.`
    : '. No hay territorio activo, quedó suelta.'))
}

function puntoDeDibujo (latlng) {
  // Clic sobre el primer punto: se cierra la manzana, que es lo que uno espera.
  if (cierraAca(latlng)) return cerrarDibujo()
  dibujo.push(ajustar(latlng).pt)
  pintarDibujo()
  pistaDibujo()
}

function pistaDibujo () {
  if (!dibujo.length) return avisar('<b>Dibujar manzana:</b> hacé clic para poner los puntos. Con el <b>imán</b> se pegan a las esquinas de las manzanas vecinas.')
  avisar(`<b>${dibujo.length} punto${dibujo.length === 1 ? '' : 's'}</b>. ` +
    (dibujo.length >= 3 ? 'Hacé clic en el <b>primer punto</b> para cerrar, o <b>Enter</b>. ' : '') +
    '<b>Retroceso</b> borra el último, <b>Esc</b> cancela.')
}

// ------------------------------------------------- traer del sistema actual
// Lee el respaldo JSON que ya exporta la app (boton "Exportar" del modulo
// Mapas) y reconstruye el modelo por manzana sin pedir un solo clic:
//   - el poligono dibujado de cada territorio define QUE manzanas le tocan
//   - los puntos de manzana con letra que ya cargaste definen COMO se llaman
function bbox (anillo) {
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity
  for (const [x, y] of anillo) {
    if (x < x0) x0 = x; if (x > x1) x1 = x
    if (y < y0) y0 = y; if (y > y1) y1 = y
  }
  return [x0, y0, x1, y1]
}
const enBbox = (p, b) => p[0] >= b[0] && p[0] <= b[2] && p[1] >= b[1] && p[1] <= b[3]

let SECTORES = {}   // numero de territorio -> sector, sacado del PDF oficial

// Se llama UNA sola vez, al abrir el editor en un navegador sin nada
// guardado. Tuvo un boton para volver a correrla a mano y se saco: el
// sistema ya esta importado y lo unico que podia hacer ese boton era
// borrar 69 territorios de trabajo.
function traerDelSistema (respaldo) {
  const registros = respaldo.records || []
  if (!registros.length) return avisar('Ese archivo no tiene territorios.')

  instantanea()
  territorios.clear()
  for (const m of manzanas.values()) { m.territorio = null; delete m.letra }

  // Centroide de cada manzana, una sola vez.
  const centros = new Map()
  for (const m of manzanas.values()) {
    centros.set(m.id, centroid(feat(m.geom)).geometry.coordinates)
  }

  const informe = { territorios: 0, asignadas: 0, conflictos: [], sinLetra: 0, letrasPerdidas: [], letrasAjenas: [] }
  const dueno = new Map()   // idManzana -> idTerritorio, para detectar solapamientos
  const idPorRegistro = new Map()  // id del respaldo -> id nuevo, sin depender del orden

  registros.forEach((r, i) => {
    const geom = r.polygon_geojson
    if (!geom || geom.type !== 'Polygon') return

    const id = 't' + i.toString(36) + Date.now().toString(36)
    idPorRegistro.set(r.id ?? i, id)
    // El nombre suele traer el numero adelante; si no, se usa el nombre entero.
    const m = String(r.name || '').match(/\d+/)
    const numero = m ? m[0] : String(r.name || i + 1).slice(0, 6)
    territorios.set(id, {
      id, numero,
      // El sector sale del PDF "Mapa x Sectores"; los territorios posteriores
      // al PDF (60 a 69) se dedujeron por cercania a los ya conocidos.
      sector: SECTORES[numero] || 'I',
      color: r.color || r.polygon_geojson?.color || PALETA[territorios.size % PALETA.length],
    })
    informe.territorios++

    const caja = bbox(geom.coordinates[0])
    const poli = feat(geom)

    for (const mz of manzanas.values()) {
      const c = centros.get(mz.id)
      if (!enBbox(c, caja)) continue
      if (!booleanPointInPolygon(c, poli)) continue

      if (dueno.has(mz.id)) {
        // Dos territorios dibujados se pisan: hoy el sistema lo permite.
        const otro = territorios.get(dueno.get(mz.id))
        informe.conflictos.push(`${otro.numero} / ${territorios.get(id).numero}`)
        continue
      }
      dueno.set(mz.id, id)
      mz.territorio = id
      informe.asignadas++
    }
  })

  // Las letras que ya cargaste mandan sobre el orden automatico.
  registros.forEach((r, i) => {
    const idT = idPorRegistro.get(r.id ?? i)
    if (!idT) return
    for (const b of r.blocks || []) {
      const p = [Number(b.lng), Number(b.lat)]
      let encontrada = null
      for (const mz of manzanas.values()) {
        if (!enBbox(p, bbox(mz.geom.coordinates[0]))) continue
        if (booleanPointInPolygon(p, feat(mz.geom))) { encontrada = mz; break }
      }
      if (!encontrada) { informe.letrasPerdidas.push(b.label); continue }

      // La manzana quedo en otro territorio. No es un solapamiento: pasa cuando
      // tu punto esta cerca del borde y el centroide de la manzana OSM cae del
      // otro lado. Es una diferencia de borde entre tu dibujo y la manzana real.
      if (encontrada.territorio && encontrada.territorio !== idT) {
        informe.letrasAjenas.push(`${b.label} de ${territorios.get(idT).numero}`)
        continue
      }
      if (!encontrada.territorio) { encontrada.territorio = idT; informe.asignadas++ }
      encontrada.letra = b.label
      encontrada.letraManual = true
    }
  })

  // Las manzanas sin letra manual se numeran solas, respetando las que vinieron.
  for (const t of territorios.values()) {
    const propias = [...manzanas.values()].filter(x => x.territorio === t.id)
    const usadas = new Set(propias.filter(x => x.letraManual).map(x => x.letra))
    const libres = LETRAS.split('').filter(l => !usadas.has(l))
    const sinLetra = propias.filter(x => !x.letraManual)
    sinLetra.forEach(x => { x.__c = centroid(feat(x.geom)).geometry.coordinates })
    sinLetra.sort((a, b) => (b.__c[1] - a.__c[1]) || (a.__c[0] - b.__c[0]))
    sinLetra.forEach((x, k) => { x.letra = libres[k] || '?'; delete x.__c })
    informe.sinLetra += sinLetra.length
  }

  activo = null
  refrescar()

  const conf = informe.conflictos.length
  avisar(`Traídos <b>${informe.territorios} territorios</b> y <b>${informe.asignadas} manzanas</b>.` +
    (informe.letrasPerdidas.length ? `<br>${icono('error')} ${informe.letrasPerdidas.length} manzanas tuyas no caen en ninguna manzana de OSM.` : '') +
    (conf ? `<br>${icono('error')} ${conf} solapamientos entre territorios dibujados.` : '') +
    (informe.letrasAjenas.length ? `<br>${icono('error')} ${informe.letrasAjenas.length} manzanas tuyas caen en el territorio de al lado (diferencia de borde).` : '') +
    (informe.sinLetra ? `<br>${informe.sinLetra} manzanas de OSM dentro de tus territorios que vos no tenías cargadas.` : ''))
  console.log('Informe de importación:', informe)
}

// ---------------------------------------------------------------- controles
document.getElementById('bCrear').onclick = () => {
  const numero = document.getElementById('nNum').value.trim()
  if (!numero) return avisar('Poné un número de territorio.')
  if ([...territorios.values()].some(t => t.numero === numero)) return avisar(`Ya existe el territorio ${numero}.`)
  instantanea()
  const id = 't' + Date.now().toString(36)
  territorios.set(id, { id, numero, sector: document.getElementById('nSec').value, color: PALETA[territorios.size % PALETA.length] })
  activo = id
  document.getElementById('nNum').value = ''
  refrescar()
  avisar(`Territorio <b>${numero}</b> creado. Hacé clic en las manzanas para sumarlas.`)
}

document.getElementById('bBorrar').onclick = async () => {
  if (!activo) return
  const t = territorios.get(activo)
  const n = [...manzanas.values()].filter(m => m.territorio === activo).length
  if (!await confirmar(`Borrar el territorio ${t.numero}`,
    `Desaparece el territorio y se pierde el número <b>${t.numero}</b>. Sus <b>${n}</b> manzanas quedan libres.` +
    `<br><br>Si solo querés rearmarlo conservando el número, usá <b>Redibujar desde cero</b>.`,
    'Borrar', true)) return
  instantanea()
  for (const m of manzanas.values()) if (m.territorio === activo) { m.territorio = null; delete m.letra }
  territorios.delete(activo)
  activo = null
  refrescar()
}

// Vaciar un territorio conservando su identidad: numero, sector y color quedan.
// Ademas se deshacen los cortes y ediciones hechos sobre SUS manzanas, para
// arrancar con las manzanas tal cual vinieron del archivo.
document.getElementById('bRedibujar').onclick = async () => {
  if (!activo) return
  const t = territorios.get(activo)
  const propias = [...manzanas.values()].filter(m => m.territorio === activo)
  if (!propias.length) return avisar(`El territorio <b>${t.numero}</b> ya está vacío. Hacé clic en las manzanas para armarlo.`)

  const tocadas = propias.filter(m => m.editada).length
  const ok = await confirmar(
    `Redibujar el territorio ${t.numero}`,
    `Se sueltan sus <b>${propias.length} manzanas</b>` +
    (tocadas ? ` y se deshacen los <b>${tocadas}</b> cortes o ediciones hechos sobre ellas` : '') +
    `. El número <b>${t.numero}</b>, el sector y el color se conservan.<br><br>Se puede deshacer con Cmd+Z.`,
    'Vaciar y redibujar', true)
  if (!ok) return

  instantanea()
  for (const m of propias) {
    if (!GEOM_ORIGINAL.has(m.id)) { manzanas.delete(m.id); continue }
    m.geom = GEOM_ORIGINAL.get(m.id)
    delete m.editada
    delete m.__diag
    // Vuelve la forma original: las caras a mano de la forma editada ya no valen.
    delete m.caras
    delete m.carasN
    m.territorio = null
    delete m.letra
    delete m.orden
  }
  paraFusionar = []; cortePuntos = []; edicion = null; dibujo = []
  capaEdicion.clearLayers(); capaCorte.clearLayers(); capaDibujo.clearLayers()
  refrescar()
  avisar(`Territorio <b>${t.numero}</b> vacío y listo. Hacé clic en las manzanas para volver a armarlo. <b>Cmd+Z</b> lo deja como estaba.`)
}

// Insertar un territorio nuevo despues de este, corriendo la numeracion.
// Sirve cuando aparece un territorio entre dos ya numerados y no se quiere
// renumerar a mano de ahi en adelante.
document.getElementById('bDerivar').onclick = async () => {
  if (!activo) return
  const t = territorios.get(activo)
  const n = parseInt(t.numero, 10)
  if (!Number.isInteger(n) || String(n) !== t.numero.trim()) {
    return avisar(`El territorio <b>${t.numero}</b> no tiene un número correlativo, así que no se puede insertar uno después. Usá <b>Crear</b> arriba.`)
  }
  const nuevo = n + 1

  // Solo se corren los de numeracion corrida; los tipo "20b" se quedan quietos.
  const corridos = [...territorios.values()]
    .filter(x => String(parseInt(x.numero, 10)) === x.numero.trim() && parseInt(x.numero, 10) >= nuevo)
  const raros = [...territorios.values()].filter(x => String(parseInt(x.numero, 10)) !== x.numero.trim())

  const ok = await confirmar(
    `Nuevo territorio ${nuevo}`,
    `Se crea el territorio <b>${nuevo}</b> vacío, en el sector <b>${t.sector}</b>.` +
    (corridos.length
      ? `<br><br>Los <b>${corridos.length}</b> territorios del ${nuevo} en adelante suben un número: el ${nuevo} pasa a ser ${nuevo + 1}, y así hasta el último.`
      : `<br><br>No hay territorios posteriores, así que no se corre ninguno.`) +
    (raros.length ? `<br><br><b>${raros.length}</b> con número no correlativo (${raros.slice(0, 3).map(x => x.numero).join(', ')}) quedan como están.` : '') +
    `<br><br>Se puede deshacer con Cmd+Z.`,
    `Crear el ${nuevo}`)
  if (!ok) return

  instantanea()
  // Se calcula sobre el numero viejo, asi que el orden del recorrido da igual.
  corridos.forEach(x => { x.numero = String(parseInt(x.numero, 10) + 1) })

  const id = 't' + Date.now().toString(36)
  territorios.set(id, { id, numero: String(nuevo), sector: t.sector, color: PALETA[territorios.size % PALETA.length] })
  activo = id

  // Queda listo para marcar, que es lo que se va a hacer enseguida.
  document.querySelector('.herr button[data-h="marcar"]').click()
  refrescar()
  avisar(`Territorio <b>${nuevo}</b> creado y vacío${corridos.length ? `, y ${corridos.length} territorios corridos un número` : ''}. Hacé clic en las manzanas para armarlo.`)
}

// Acciones en grupo: una sola entrada en el historial, se deshacen juntas.
function enGrupo (borrar) {
  const ids = [...mzSel]
  if (!ids.length) return
  instantanea()
  for (const id of ids) {
    const m = manzanas.get(id)
    if (!m) continue
    if (borrar) { manzanas.delete(id); descartadas.add(id) }
    else { m.territorio = null; delete m.letra; delete m.orden }
  }
  const t = territorios.get(activo)
  mzSel.clear()
  reletrar(activo)
  refrescar()
  avisar(borrar
    ? `<b>${ids.length}</b> manzanas borradas del prototipo. <b>Cmd+Z</b> las devuelve.`
    : `<b>${ids.length}</b> manzanas sacadas del territorio ${t.numero}. Siguen en el mapa, libres. <b>Cmd+Z</b> las devuelve.`)
}

// Cambiar el color se guarda en el borrador y se publica con el territorio.
function cambiarColorTerritorio (color) {
  if (!activo || !territorios.has(activo)) return
  if (publicacionEnVuelo) return avisar('Esperá a que termine el guardado para cambiar el color.')
  if (!/^#[0-9a-f]{6}$/i.test(color)) return
  const t = territorios.get(activo)
  if (t.color.toLowerCase() === color.toLowerCase()) return
  instantanea()
  if (t.colorBase == null) t.colorBase = t.color
  t.color = color
  if (t.color.toLowerCase() === t.colorBase.toLowerCase()) delete t.colorBase
  refrescar()
  avisar('Color cambiado en el borrador. Guardá en la base para aplicarlo. <b>Cmd+Z</b> deshace.')
}

// ------------------------------------------- colores de los territorios de al lado
// Dos territorios que se tocan y llevan el mismo color se leen como uno solo
// (en la captura habia rojos pegados). La ficha marca, con texto y no solo con
// color, cuales de la paleta ya usan los vecinos, y puede sugerir uno libre.
function escHtml (s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]))
}
function esColorHex (c) { return /^#[0-9a-f]{6}$/i.test(String(c)) }
function numerosEnTexto (xs) {
  return xs.length < 2 ? xs.join('') : xs.slice(0, -1).join(', ') + ' y ' + xs[xs.length - 1]
}

// color en minuscula -> numeros de los vecinos que lo usan (de menor a mayor).
function coloresAlLado (t) {
  const usados = new Map()
  for (const idOtro of vecinosDe(t.id).keys()) {
    const otro = territorios.get(idOtro)
    if (!otro || !esColorHex(otro.color)) continue
    const c = String(otro.color).toLowerCase()
    if (!usados.has(c)) usados.set(c, [])
    usados.get(c).push(String(otro.numero))
  }
  for (const nums of usados.values()) nums.sort((a, b) => (parseInt(a) || 0) - (parseInt(b) || 0) || a.localeCompare(b))
  return usados
}

function nombreDeColor (c) {
  const i = PALETA.findIndex(p => p.toLowerCase() === String(c).toLowerCase())
  return i >= 0 ? nombresColores[i] : String(c).toUpperCase()
}

function pintarColoresVecinos (t, cuantasManzanas) {
  const usados = coloresAlLado(t)
  document.querySelectorAll('#paletaTerritorio button').forEach(b => {
    const nums = usados.get(b.dataset.color.toLowerCase())
    const texto = nums
      ? `${b.dataset.nombre}, en uso al lado (territorio${nums.length === 1 ? '' : 's'} ${numerosEnTexto(nums)})`
      : b.dataset.nombre
    b.classList.toggle('al-lado', Boolean(nums))
    b.title = texto
    b.setAttribute('aria-label', texto)
  })

  const leyenda = document.getElementById('coloresAlLado')
  if (!cuantasManzanas) {
    leyenda.textContent = 'Sumale manzanas para ver qué colores usan los territorios de al lado.'
    return
  }
  if (!usados.size) {
    leyenda.textContent = vecinosDe(t.id).size
      ? 'Los territorios de al lado no tienen un color válido: cualquiera sirve.'
      : 'Este territorio no toca a ningún otro: cualquier color sirve.'
    return
  }
  const lista = [...usados.entries()].map(([c, nums]) =>
    `<i style="background:${c}"></i>${escHtml(nombreDeColor(c))} (territorio${nums.length === 1 ? '' : 's'} ${escHtml(numerosEnTexto(nums))})`).join(' · ')
  const choca = usados.get(String(t.color).toLowerCase())
  leyenda.innerHTML = `<b style="font-weight:500">En uso al lado:</b> ${lista}.` +
    (choca
      ? `<br><span class="alerta">${icono('error')} El color de este territorio ya lo usa el ${choca.length === 1 ? 'territorio' : 'territorios'} ${escHtml(numerosEnTexto(choca))}. Tocá <b>Sugerir color</b>.</span>`
      : '')
}

// Elige de la paleta un color que ningun vecino use. Si el actual ya esta
// libre no lo toca; entre los libres prefiere el menos repetido en todo el mapa
// para que los colores se repartan parejo.
function sugerirColor () {
  if (!activo || !territorios.has(activo)) return
  const t = territorios.get(activo)
  if (!vecinosDe(t.id).size) return avisar('Este territorio no toca a ningún otro, así que cualquier color sirve. Lo dejé como está.')
  const usados = coloresAlLado(t)
  if (!usados.has(String(t.color).toLowerCase())) return avisar('Ningún territorio de al lado usa este color. Lo dejé como está.')
  const libres = PALETA.filter(c => !usados.has(c.toLowerCase()))
  if (!libres.length) return avisar('Los territorios de al lado ya usan los ocho colores de la paleta. Elegí uno propio con el selector de color.')
  const reparto = new Map()
  for (const x of territorios.values()) {
    const c = String(x.color).toLowerCase()
    reparto.set(c, (reparto.get(c) || 0) + 1)
  }
  libres.sort((a, b) => (reparto.get(a.toLowerCase()) || 0) - (reparto.get(b.toLowerCase()) || 0))
  const elegido = libres[0]
  cambiarColorTerritorio(elegido)
  // cambiarColorTerritorio avisa o se niega (guardado en curso): el mensaje
  // propio solo va si el color de verdad cambio.
  if (String(t.color).toLowerCase() === elegido.toLowerCase()) {
    avisar(`Color cambiado a <b>${nombreDeColor(elegido)}</b>: ningún territorio de al lado lo usa. Guardá en la base para aplicarlo. <b>Cmd+Z</b> deshace.`)
  }
}
document.getElementById('bSugerirColor').onclick = sugerirColor

document.getElementById('bRenom').onclick = async () => {
  if (!activo) return
  if (publicacionEnVuelo) return avisar('Esperá a que termine el guardado para renumerar.')
  const t = territorios.get(activo)
  const entrada = await pedir('Renumerar', `Nuevo número para el territorio <b>${t.numero}</b>. Si está ocupado, podés intercambiar los dos números.`, t.numero)
  const n = entrada?.trim()
  if (!n || n === String(t.numero)) return
  // Los números son rótulos cortos, no HTML.
  if (!/^[0-9]+[a-zA-Z]?(?:[.-][0-9]+)?$/.test(n)) return avisar('Usá un número de territorio, por ejemplo 5, 5b o 5.1.')
  const otro = [...territorios.values()].find(x => x.id !== t.id && String(x.numero).toLowerCase() === n.toLowerCase())
  const anterior = String(t.numero)
  const numeroOtro = otro ? String(otro.numero) : null
  if (otro && !await confirmar('Intercambiar números',
    `El territorio <b>${anterior}</b> pasa a ser <b>${otro.numero}</b> y el actual <b>${otro.numero}</b> pasa a ser <b>${anterior}</b>.<br><br>Cada uno conserva sus manzanas y su historial. Los demás territorios mantienen su número.`, 'Intercambiar')) return
  if (publicacionEnVuelo || territorios.get(t.id) !== t || String(t.numero) !== anterior ||
      (otro && (territorios.get(otro.id) !== otro || String(otro.numero) !== numeroOtro))) return avisar('El editor cambió. Volvé a intentar la renumeración.')
  instantanea()
  cambiarNumeroTerritorio(t, otro ? String(otro.numero) : n)
  if (otro) cambiarNumeroTerritorio(otro, anterior)
  refrescar()
  avisar(otro
    ? `Números <b>${anterior}</b> y <b>${t.numero}</b> intercambiados en el borrador. Guardá en la base para aplicarlos juntos. <b>Cmd+Z</b> deshace.`
    : `Número cambiado a <b>${n}</b> en el borrador. Guardá en la base para aplicarlo. <b>Cmd+Z</b> deshace.`)
}

document.getElementById('bDividirT').onclick = async () => {
  if (!activo) return
  const t = territorios.get(activo)
  const propias = [...manzanas.values()].filter(m => m.territorio === activo)
  if (propias.length < 2) return avisar('Necesita al menos 2 manzanas para dividirse.')
  const n = await pedir('Dividir territorio',
    `El territorio nuevo se lleva la mitad sur de las <b>${propias.length}</b> manzanas del ${t.numero}. ¿Qué número le ponemos?`,
    t.numero + 'b')
  if (!n) return
  if ([...territorios.values()].some(x => x.numero === n)) return avisar(`Ya existe el territorio <b>${n}</b>.`)
  instantanea()
  const id = 't' + Date.now().toString(36)
  territorios.set(id, { id, numero: n.trim(), sector: t.sector, color: PALETA[territorios.size % PALETA.length] })
  propias.forEach(m => { m.__c = centroid(feat(m.geom)).geometry.coordinates })
  propias.sort((a, b) => b.__c[1] - a.__c[1])
  propias.slice(Math.ceil(propias.length / 2)).forEach(m => { m.territorio = id })
  propias.forEach(m => delete m.__c)
  reletrar(activo); reletrar(id)
  refrescar()
  avisar(`Dividido en <b>${t.numero}</b> y <b>${n}</b>.`)
}

// Cortar sin haber vinculado archivo es la forma de perder el trabajo: se avisa.
//
// Hay dos formas de perderlo. Una es no tener ninguna copia fuera de este
// navegador (lo de siempre). La otra es que lo ultimo que se hizo todavia no
// llego al borrador de la base: la escritura espera su turno (se agrupan 1,2 s),
// va en viaje, o fallo / no hay sesion / hubo un choque con otra persona. En
// todos esos casos borradorPendiente sigue lleno, y una copia en disco no
// cambia lo que la base NO tiene.
function hayTrabajoSinGuardar () {
  // Sin base configurada (desarrollo local) no hay a donde mandarlo.
  if (BD_URL && BD_KEY && (borradorPendiente || borradorEnVuelo)) return true
  // Vaciado a proposito: lo que se haga despues no se escribe en ningun lado.
  if (vaciadoSinBase) return estadoActual() !== estadoVaciado
  if (manejadorArchivo) return false
  return Boolean(descartadas.size || revisadas.size || [...manzanas.values()].some(m => m.editada))
}

// Un anillo exterior de al menos 3 vertices distintos, con numeros de verdad.
// Devuelve un poligono nuevo (nunca el del archivo) o null si no sirve.
function geometriaValida (g) {
  if (!g || g.type !== 'Polygon' || !Array.isArray(g.coordinates) || !Array.isArray(g.coordinates[0])) return null
  const pts = []
  for (const p of g.coordinates[0]) {
    if (!Array.isArray(p) || !Number.isFinite(p[0]) || !Number.isFinite(p[1])) return null
    if (Math.abs(p[0]) > 180 || Math.abs(p[1]) > 90) return null
    pts.push([p[0], p[1]])
  }
  if (!pts.length) return null
  const cerrado = pts[0][0] === pts[pts.length - 1][0] && pts[0][1] === pts[pts.length - 1][1]
  if (!cerrado) pts.push([...pts[0]])
  if (pts.length < 4) return null
  return { type: 'Polygon', coordinates: [pts] }
}

// La forma minima que tiene que tener un respaldo hecho con Exportar. Se mira
// ANTES de tocar nada: si algo no cierra, no se cambia una sola cosa.
// Devuelve { ok: true, territorios, manzanas, pendientes } con copias limpias
// (solo los campos que el editor conoce) o { ok: false, motivo }.
function validarImportacion (d) {
  const mal = (motivo) => ({ ok: false, motivo })
  if (!d || typeof d !== 'object' || Array.isArray(d)) return mal('No es un respaldo de territorios: elegí un archivo que hayas bajado con <b>Exportar</b>.')
  if (!Array.isArray(d.territorios) || !d.territorios.length) return mal('No trae ningún territorio.')
  if (!Array.isArray(d.manzanas)) return mal('No trae la lista de manzanas.')

  const lista = []
  const ids = new Set()
  const numeros = new Set()
  let pendientes = 0
  for (let i = 0; i < d.territorios.length; i++) {
    const t = d.territorios[i]
    if (!t || typeof t !== 'object') return mal(`El territorio ${i + 1} del archivo está mal formado.`)
    const id = typeof t.id === 'string' ? t.id.trim() : ''
    if (!id || id.length > 64) return mal(`El territorio ${i + 1} del archivo no tiene identificador.`)
    if (ids.has(id)) return mal(`Hay dos territorios con el mismo identificador (${escHtml(id)}).`)
    // Los numeros van tal cual al panel y al mapa: cortos y sin marcado.
    const numero = (typeof t.numero === 'number' ? String(t.numero) : typeof t.numero === 'string' ? t.numero.trim() : '')
    if (!numero || numero.length > 16 || /[<>&"'`]/.test(numero)) return mal(`El territorio ${i + 1} del archivo no tiene un número válido.`)
    if (numeros.has(numero.toLowerCase())) return mal(`El número ${escHtml(numero)} está repetido en el archivo.`)
    ids.add(id)
    numeros.add(numero.toLowerCase())
    if (t.numeroBase != null || t.colorBase != null) pendientes++
    const limpio = {
      id, numero,
      sector: typeof t.sector === 'string' && /^[IVX]{1,4}$/.test(t.sector) ? t.sector : 'I',
      color: esColorHex(t.color) ? t.color : PALETA[lista.length % PALETA.length],
    }
    if (t.letras === 'orden' || t.letras === 'proximidad') limpio.letras = t.letras
    lista.push(limpio)
  }

  const vistas = new Set()
  const manzanasOk = []
  for (let i = 0; i < d.manzanas.length; i++) {
    const mm = d.manzanas[i]
    if (!mm || typeof mm !== 'object') return mal(`La manzana ${i + 1} del archivo está mal formada.`)
    if (typeof mm.id !== 'string' || !mm.id || mm.id.length > 128) return mal(`La manzana ${i + 1} del archivo no tiene identificador.`)
    if (vistas.has(mm.id)) return mal(`La manzana ${escHtml(mm.id)} aparece dos veces en el archivo.`)
    if (!ids.has(mm.territorio)) return mal(`La manzana ${escHtml(mm.id)} apunta a un territorio que no está en el archivo.`)
    const geometria = geometriaValida(mm.geometria)
    if (!geometria) return mal(`La manzana ${escHtml(mm.id)} no tiene una forma válida.`)
    vistas.add(mm.id)
    manzanasOk.push({ id: mm.id, territorio: mm.territorio, geometria })
  }
  return { ok: true, territorios: lista, manzanas: manzanasOk, pendientes }
}

document.getElementById('fImport').onchange = async (e) => {
  const entrada = e.target
  const f = entrada.files[0]; if (!f) return
  try {
    const medias = gestoSinCerrar()
    if (medias) return avisar(medias)

    let d
    try { d = JSON.parse(await f.text()) } catch (err) {
      return avisar('<b>No pude leer ese archivo.</b> No es un JSON válido: elegí uno que hayas bajado con <b>Exportar</b>. No se cambió nada.')
    }
    const v = validarImportacion(d)
    if (!v.ok) return avisar(`<b>Ese archivo no sirve para importar.</b> ${v.motivo} No se cambió nada.`)

    // Reemplaza TODO, incluido el borrador compartido que se escribe enseguida:
    // se dice con todas las letras y se pide un si.
    const antes = territorios.size
    if (antes && !await confirmar('Importar el archivo',
      `Se reemplazan los <b>${antes}</b> territorios de este editor por los <b>${v.territorios.length}</b> del archivo, con sus <b>${v.manzanas.length}</b> manzanas. ` +
      'También se reemplaza el borrador compartido que ven los demás administradores. Lo ya publicado en la base no se toca.' +
      '<br><br>Se deshace con Cmd+Z mientras no cierres la página.',
      'Importar', true)) return

    // Recién acá, con el archivo ya validado y confirmado, se toca el estado.
    cortarGestos()
    instantanea()
    territorios = new Map(v.territorios.map(t => [t.id, t]))
    // Los cambios sin publicar eran de los territorios de antes. Los
    // numeroBase / colorBase que el archivo pudiera traer tampoco se arrastran:
    // la base conoce a cada territorio por el nombre con el que se publico, y
    // uno de otra fecha podria renombrar el territorio equivocado.
    tocados = new Set()
    for (const m of manzanas.values()) { m.territorio = null; delete m.letra; delete m.orden }
    for (const mm of v.manzanas) {
      // Si el archivo la trae, vuelve aunque se la hubiera borrado a mano.
      descartadas.delete(mm.id)
      const m = manzanas.get(mm.id)
      if (!m) {
        manzanas.set(mm.id, { id: mm.id, geom: mm.geometria, territorio: mm.territorio, editada: true })
        continue
      }
      if (JSON.stringify(m.geom) !== JSON.stringify(mm.geometria)) {
        // Forma distinta de la que habia: hay que guardarla como editada (si no,
        // al recargar vuelve la de OpenStreetMap) y sus caras a mano ya no valen.
        m.geom = mm.geometria
        m.editada = true
        limpiarDiag(m)
        delete m.caras
        delete m.carasN
      }
      m.territorio = mm.territorio
    }
    territorios.forEach(t => reletrar(t.id))
    activo = null
    refrescar()
    // El imán guarda los vecinos ya pasados a pixeles: con formas nuevas, hay que rehacerlos.
    prepararIman()
    avisar(`Importados <b>${v.territorios.length}</b> territorios y <b>${v.manzanas.length}</b> manzanas. <b>Cmd+Z</b> lo deshace.` +
      (v.pendientes
        ? `<br>${icono('error')} El archivo traía <b>${v.pendientes}</b> territorio${v.pendientes === 1 ? '' : 's'} con número o color sin publicar: no se arrastran. Revisalos con <b>Ver qué falta guardar</b>.`
        : ''))
  } finally {
    // Sin esto, elegir de nuevo el mismo archivo no dispara nada.
    entrada.value = ''
  }
}

// Donde se escribe o se elige, las teclas son de quien escribe: un 1 en un
// campo no puede cambiar de herramienta ni un Retroceso borrar un punto.
function esCampoDeTexto (el) {
  if (!el) return false
  const tag = el.tagName
  return tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA' || el.isContentEditable === true
}

addEventListener('keydown', (e) => {
  if (esCampoDeTexto(e.target)) return
  // Con un dialogo abierto el teclado es del dialogo, no del mapa.
  if (document.querySelector('.velo')) return

  // El menu "Más" abierto y con el foco adentro: Esc lo cierra, y nada mas.
  // No se pierde ningun gesto: solo se cierra una lista.
  if (e.key === 'Escape' && e.target.closest?.('#menuMas') && document.getElementById('menuMas').open) {
    document.getElementById('menuMas').open = false
    return
  }

  const conMando = e.metaKey || e.ctrlKey

  // Deshacer y rehacer.
  if (conMando && e.key.toLowerCase() === 'z') {
    e.preventDefault()
    // Estando a medio dibujar, Cmd+Z saca el ULTIMO PUNTO. Antes se iba al
    // historial y borraba la manzana anterior, que ya estaba bien cerrada.
    if (herramienta === 'dibujar' && dibujo.length) {
      dibujo.pop(); pintarDibujo(); pistaDibujo()
      return
    }
    // Igual que con el dibujo: con letras a medio poner, Cmd+Z saca la
    // ultima que tocaste, no el paso anterior del historial.
    if (herramienta === 'letras' && letrasNuevas.length) {
      letrasNuevas = letrasNuevas.slice(0, -1)
      pintarLetrasNuevas()
      return
    }
    if (e.shiftKey) rehacer(); else deshacer()
    return
  }

  if (e.key === 'Escape') {
    // Se va soltando de a una cosa por vez, de lo mas chico a lo mas grande:
    // primero el gesto en curso, y recien al final el territorio.
    if (dibujo.length) { cancelarDibujo(); avisar('Dibujo descartado.'); return }
    if (cancelarLetras()) return
    if (burbuja) { cerrarBurbuja(); return }
    if (edicion) { terminarEdicion(); return }
    if (paraFusionar.length) { paraFusionar = []; refrescarMapa(); return }
    if (cortePuntos.length) { cortePuntos = []; capaCorte.clearLayers(); return }
    // Salir de la herramienta: es lo que hace falta para dejar de dibujar,
    // borrar o marcar sin querer con el proximo clic.
    if (herramienta !== 'ver') {
      document.querySelector('.herr button[data-h="ver"]').click()
      return
    }
    if (activo) deseleccionar()
    return
  }

  if (herramienta === 'letras' && letrasNuevas.length && e.key === 'Enter') {
    e.preventDefault(); aplicarLetrasNuevas(); return
  }

  if (herramienta === 'dibujar' && dibujo.length) {
    if (e.key === 'Enter') { e.preventDefault(); cerrarDibujo(); return }
    if (e.key === 'Backspace') { e.preventDefault(); dibujo.pop(); pintarDibujo(); pistaDibujo(); return }
  }

  // Cambio de herramienta. No con Cmd/Ctrl: eso es un atajo del navegador.
  const map = { 1: 'dibujar', 2: 'dividir', 3: 'fusionar', 4: 'mover', 5: 'editar', 6: 'marcar', 7: 'borrar', 8: 'caras', 9: 'letras' }
  if (map[e.key] && !conMando) document.querySelector(`.herr button[data-h="${map[e.key]}"]`).click()
})
