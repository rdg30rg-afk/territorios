<!doctype html>
<html lang="es-AR" data-theme="hermano">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/pwa/icon-180.png" />
    <!-- Urbanist: la pide vista-hermano.css en ocho reglas y no estaba
         cargada en ningun lado, asi que la vista del hermano venia cayendo
         en la fuente del sistema. Va como <link> y no como @import de CSS
         para que el navegador la pida en paralelo con la hoja de estilos. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700&display=swap"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#cbea5b" />
    <meta name="color-scheme" content="light" />
    <meta name="application-name" content="Territorios" />
    <meta name="apple-mobile-web-app-title" content="Territorios" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta
      name="description"
      content="Administración territorial para mapas, grupos y salidas."
    />
    <title>Territorios San Juan</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
