  }
})

document.querySelectorAll('#chipsSector button').forEach(b => {
  b.onclick = () => {
    document.querySelectorAll('#chipsSector button').forEach(x => x.classList.remove('on'))
    b.classList.add('on'); filtroSector = b.dataset.s; refrescarPanel()
  }
})

document.getElementById('cIman').onchange = (e) => { iman = e.target.checked }
document.getElementById('cLetras').onchange = (e) => { verLetras = e.target.checked; refrescarMapa() }
document.getElementById('cRevisar').onchange = (e) => {
  verRevision = e.target.checked
  refrescar()
  if (verRevision) avisar('En <b>naranja punteado</b>, las manzanas mal generadas por OSM. La lista de la izquierda te lleva a cada una.')
}

document.getElementById('bVincular').onclick = () => vincularArchivo()

// Cortar sin haber vinculado archivo es la forma de perder el trabajo: se avisa.
addEventListener('beforeunload', (e) => {
  if (manejadorArchivo) return
  if (!descartadas.size && !revisadas.size && ![...manzanas.values()].some(m => m.editada)) return
  e.preventDefault()
  e.returnValue = ''
})

document.getElementById('bExport').onclick = () => {
  const datos = {
    generado: new Date().toISOString(),
    territorios: [...territorios.values()],
    manzanas: [...manzanas.values()].filter(m => m.territorio).map(m => ({
      id: m.id, letra: m.letra, territorio: m.territorio, geometria: m.geom,
    })),
  }
  const a = document.createElement('a')
  a.href = URL.createObjectURL(new Blob([JSON.stringify(datos, null, 2)], { type: 'application/json' }))
  a.download = 'territorios.json'
  a.click()
}

document.getElementById('bImport').onclick = () => document.getElementById('fImport').click()
document.getElementById('fImport').onchange = async (e) => {
  const f = e.target.files[0]; if (!f) return
  const d = JSON.parse(await f.text())
  instantanea()
  territorios = new Map((d.territorios || []).map(t => [t.id, t]))
  for (const m of manzanas.values()) { m.territorio = null; delete m.letra }
  for (const mm of d.manzanas || []) {
    const m = manzanas.get(mm.id) || { id: mm.id, geom: mm.geometria, editada: true }
    m.geom = mm.geometria; m.territorio = mm.territorio
    manzanas.set(m.id, m)
  }
  territorios.forEach(t => reletrar(t.id))
  activo = null; refrescar()
}

document.getElementById('bReset').onclick = async () => {
  if (!await confirmar('Vaciar la prueba',
    'Se borran <b>todos</b> los territorios de este prototipo. La base de datos de la app no se toca.',
    'Vaciar todo', true)) return
  instantanea()
  territorios.clear()
  for (const m of manzanas.values()) { m.territorio = null; delete m.letra }
  activo = null
  localStorage.removeItem(CLAVE)
  refrescar()
}

addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return
  // Con un dialogo abierto el teclado es del dialogo, no del mapa.
  if (document.querySelector('.velo')) return

  const conMando = e.metaKey || e.ctrlKey

  // Deshacer y rehacer.
  if (conMando && e.key.toLowerCase() === 'z') {
    e.preventDefault()
    // Estando a medio dibujar, Cmd+Z saca el ULTIMO PUNTO. Antes se iba al
    // historial y borraba la manzana anterior, que ya estaba bien cerrada.
    if (herramienta === 'dibujar' && dibujo.length) {
      dibujo.pop(); pintarDibujo(); pistaDibujo()
      return
    }
    if (e.shiftKey) rehacer(); else deshacer()
    return
  }

  if (e.key === 'Escape') {
    // Se va soltando de a una cosa por vez, de lo mas chico a lo mas grande:
    // primero el gesto en curso, y recien al final el territorio.
    if (dibujo.length) { cancelarDibujo(); avisar('Dibujo descartado.'); return }
    if (burbuja) { cerrarBurbuja(); return }
    if (edicion) { terminarEdicion(); return }
    if (paraFusionar.length) { paraFusionar = []; refrescarMapa(); return }
    if (cortePuntos.length) { cortePuntos = []; capaCorte.clearLayers(); return }
    // Salir de la herramienta: es lo que hace falta para dejar de dibujar,
    // borrar o marcar sin querer con el proximo clic.
    if (herramienta !== 'ver') {
      document.querySelector('.herr button[data-h="ver"]').click()
      return
    }
    if (activo) deseleccionar()
    return
  }

  if (herramienta === 'dibujar' && dibujo.length) {
    if (e.key === 'Enter') { e.preventDefault(); cerrarDibujo(); return }
    if (e.key === 'Backspace') { e.preventDefault(); dibujo.pop(); pintarDibujo(); pistaDibujo(); return }
  }

  // Cambio de herramienta. No con Cmd/Ctrl: eso es un atajo del navegador.
  const map = { 1: 'dibujar', 2: 'dividir', 3: 'fusionar', 4: 'mover', 5: 'editar', 6: 'marcar', 7: 'borrar' }
  if (map[e.key] && !conMando) document.querySelector(`.herr button[data-h="${map[e.key]}"]`).click()
})

let avisoZoom = null
mapa.on('click', (ev) => {
  if (herramienta === 'dibujar') return puntoDeDibujo(ev.latlng)
  // Los poligonos frenan su propio clic, asi que llegar aca significa que se
  // toco el mapa pelado: se suelta el territorio.
  if (activo) deseleccionar()
})

mapa.on('mousemove', (ev) => {
  if (herramienta !== 'dibujar' || !dibujo.length) return
  const cerrando = cierraAca(ev.latlng)
  const a = ajustar(ev.latlng)
  pintarDibujo(a.pt, a.tipo, cerrando)
})

mapa.on('mouseout', () => { if (herramienta === 'dibujar') pintarDibujo() })

mapa.on('moveend zoomend', () => {
  refrescarMapa()
  prepararIman()
  const z = mapa.getZoom()
  const nuevo = z < ZOOM_MANZANAS ? 'lejos' : 'cerca'
  if (nuevo === avisoZoom) return
  avisoZoom = nuevo
  avisar(z < ZOOM_MANZANAS
    ? 'Vista de <b>ciudad</b>: se ven solo los territorios armados. <b>Acercá</b> para ver y marcar las manzanas.'
    : TOCAN_LIBRES.has(herramienta)
      ? `Las <b>azules</b> son manzanas sin territorio. Hacé clic para sumarlas al activo.`
      : `<b>${[...territorios.values()].length} territorios</b>. Elegí uno en la lista para trabajarlo.`)
})

// Se restablece la ultima herramienta usada, antes de cargar las manzanas.
try {
  const guardada = localStorage.getItem(CLAVE + ':herr')
  // 'marcar' era el default viejo; si quedo guardado de antes, no se arrastra.
  const boton = guardada && document.querySelector(`.herr button[data-h="${guardada}"]`)
  if (boton) {
    document.querySelectorAll('.herr button').forEach(x => x.classList.remove('on'))
    boton.classList.add('on')
    herramienta = guardada
  }
} catch (e) { /* si no se puede leer, queda la de siempre */ }

pintarEstadoArchivo()

// Expuesto a proposito: permite inspeccionar el estado desde la consola.
Object.assign(window, { mapa, manzanas: () => manzanas, territorios: () => territorios })

// ---------------------------------------------------------------- arranque
const r = await fetch('/datos/manzanas-congregacion.geojson')
const gj = await r.json()
for (const f of gj.features) {
  manzanas.set(f.properties.id, { id: f.properties.id, geom: f.geometry, territorio: null })
  GEOM_ORIGINAL.set(f.properties.id, f.geometry)
}

try {
  const sv = await fetch('/datos/sin-viviendas.json')
  if (sv.ok) SIN_VIVIENDAS = new Map(Object.entries(await sv.json()))
} catch (e) { /* sin el archivo el diagnostico sigue, con menos datos */ }

try {
  const g = JSON.parse(localStorage.getItem(CLAVE) || 'null')
  if (g) {
    territorios = new Map((g.territorios || []).map(t => [t.id, t]))
    descartadas = new Set(g.descartadas || [])
    revisadas = new Set(g.revisadas || [])
    for (const id of descartadas) manzanas.delete(id)
    for (const { id, geom } of g.editadas || []) {
      manzanas.set(id, { id, geom, territorio: null, editada: true })
    }
    for (const [idM, idT, orden] of g.asignacion || []) {
      const m = manzanas.get(idM); if (!m) continue
      m.territorio = idT
      if (orden != null) { m.orden = orden; ordenSiguiente = Math.max(ordenSiguiente, orden + 1) }
    }
    territorios.forEach(t => reletrar(t.id))
  }
} catch (e) { /* si el guardado quedo corrupto, se arranca limpio */ }

// La primera vez se cargan solos los territorios reales del sistema actual.
if (!territorios.size) {
  try {
    const sec = await fetch('/datos/sectores.json')
    if (sec.ok) SECTORES = await sec.json()
    const resp = await fetch('/datos/respaldo-actual.json')
    if (resp.ok) traerDelSistema(await resp.json())
  } catch (e) { /* si no esta el respaldo, se arranca vacio */ }
}

refrescar()
if (!territorios.size) {
  avisar(`<b>${manzanas.size.toLocaleString('es-AR')} manzanas</b> en el área de la congregación.<br>Creá un territorio y hacé clic para sumarle manzanas.`)
}
</script>
